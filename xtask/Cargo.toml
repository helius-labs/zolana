[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# The port added seven binaries under `src/bin`, which made the bare
# `cargo run -p xtask -- program-ids` the localnet recipes rely on ambiguous.
# Those recipes `eval` its output, so the failure surfaced only as an unset
# SHIELDED_POOL_PROGRAM_ID minutes later.
default-run = "xtask"

[dependencies]
anyhow = { workspace = true }
ark-bn254 = { workspace = true }
ark-ec = "0.5"
ark-ff = { workspace = true }
base64 = { workspace = true }
bincode = "1.3"
borsh = { workspace = true }
bs58 = { workspace = true }
bytemuck = { workspace = true }
light-poseidon = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
p256 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wincode = { workspace = true }
groth16-solana = { workspace = true, features = ["gnark-vk", "circom-vk", "bsb22"] }
solana-bn254 = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-commitment-config = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
zolana-client = { workspace = true, features = ["solana-rpc"] }
zolana-event = { workspace = true }
zolana-hasher = { workspace = true, features = ["poseidon", "sha256", "keccak"] }
zolana-indexed-array = { workspace = true }
zolana-interface = { workspace = true }
zolana-keypair = { workspace = true }
zolana-merkle-tree = { workspace = true }
zolana-transaction = { workspace = true }
zolana-wallet = { workspace = true }
zolana-test-utils = { workspace = true }
zolana-user-registry-interface = { workspace = true, features = ["solana"] }
zolana-program-test = { workspace = true }
swap-program = { path = "../sdk-tests/zk-program-swap/program" }
