[package]
name = "spr-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "zolana"
path = "src/main.rs"

[dependencies]
spr-protocol-instructions = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
groth16-solana = { workspace = true, features = ["gnark-vk"] }
hex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-instruction = { workspace = true }
solana-address = { workspace = true }
solana-keypair = { workspace = true }
solana-loader-v3-interface = { workspace = true }
solana-loader-v4-interface = { workspace = true }
solana-pubkey = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["client"] }
spr-interface = { workspace = true }
spr-program = { workspace = true, features = ["client", "setup", "parallel", "build"] }
spr-user-registry-interface = { workspace = true, features = ["solana"] }
spr-keypair = { workspace = true }
spr-transaction = { workspace = true }
