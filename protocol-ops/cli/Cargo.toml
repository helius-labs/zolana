[package]
name = "zolana-protocol-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "zolana-protocol"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bincode = "1.3"
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-commitment-config = { workspace = true }
solana-hash = { workspace = true }
solana-transaction = { workspace = true }
solana-instruction = { workspace = true }
solana-message = { workspace = true }
solana-keypair = { workspace = true }
solana-loader-v3-interface = { workspace = true, features = ["serde"] }
solana-loader-v3-interface-v7 = { package = "solana-loader-v3-interface", version = "7.0", features = ["bincode"] }
solana-pubkey = { workspace = true }
solana-rpc-client = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
zolana-protocol-instructions = { workspace = true }
zolana-interface = { workspace = true }
zolana-tree = { workspace = true }
zolana-smart-account-client = { workspace = true }
