[package]
name = "zolana-forester-prover"
version = "0.1.0"
publish = false
description = "Batch nullifier-tree proofs with existing gnark keys, locally through Go FFI or over HTTP."
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gnark"]
gnark = []

[dependencies]
anyhow = { workspace = true }
groth16-solana = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
solana-address = { workspace = true }
solana-bn254 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true }
zolana-merkle-tree = { workspace = true }
zolana-tree = { workspace = true, features = ["verify"] }
