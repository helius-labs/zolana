[package]
name = "zolana-squads-client"
version.workspace = true
edition.workspace = true

[dependencies]
zolana-squads-sdk = { workspace = true, features = ["prover", "encryption", "rpc"] }
zolana-squads-interface = { workspace = true, features = ["solana"] }
zolana-client = { workspace = true, features = ["solana-rpc"] }
zolana-keypair = { workspace = true }
zolana-transaction = { workspace = true }
zolana-interface = { workspace = true }
zolana-hasher = { workspace = true, features = ["std"] }


thiserror = { workspace = true }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
solana-signature = { workspace = true }
zolana-event-parser = { workspace = true }

[dev-dependencies]
squads-prover = { workspace = true, features = ["test-server"] }
zolana-event = { workspace = true }
groth16-solana = { workspace = true }
