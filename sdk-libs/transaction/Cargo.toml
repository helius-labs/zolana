[package]
name = "zolana-transaction" # TODO: rename as zolana-sdk
version = "0.1.0"
description = "TSPP output UTXO serialization: plaintext and encrypted UTXO layouts for transfer and split, encrypted and decrypted via zolana-keypair."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ark-bn254 = { version = "0.6", optional = true }
zolana-zk-dsl = { workspace = true, optional = true, features = ["circuit"] }
zolana-zk-gadgets = { workspace = true, optional = true }
zolana-interface = { workspace = true }
zolana-event = { workspace = true }
zolana-hasher = { workspace = true }
zolana-keypair = { workspace = true }
zolana-instruction = { workspace = true }
borsh = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
solana-address = { workspace = true }
solana-signature = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
# How mints and wallet utxos enter a zk circuit.
circuit = [
    "dep:ark-bn254",
    "dep:zolana-zk-dsl",
    "dep:zolana-zk-gadgets",
    "zolana-keypair/circuit",
]
serde = ["dep:serde", "zolana-keypair/serde"]
tsify = ["serde", "dep:tsify", "dep:wasm-bindgen", "zolana-keypair/tsify"]

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen"]

[dev-dependencies]
criterion = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[[bench]]
name = "wallet_ops"
harness = false

[[test]]
name = "serde"
path = "tests/serde.rs"
required-features = ["serde"]
