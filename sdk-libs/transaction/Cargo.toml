[package]
name = "spr-transaction" # TODO: rename as zolana-sdk
version = "0.1.0"
description = "TSPP output UTXO serialization: plaintext and encrypted UTXO layouts for transfer and split, encrypted and decrypted via spr-keypair."
edition.workspace = true
license.workspace = true
repository.workspace = true

publish = ["crates-io"]

[dependencies]
ark-bn254 = { version = "0.6", optional = true }
spr-zk-dsl = { workspace = true, optional = true, features = ["circuit"] }
spr-zk-gadgets = { workspace = true, optional = true }
spr-interface = { workspace = true }
spr-event = { workspace = true }
spr-hasher = { workspace = true }
spr-keypair = { workspace = true }
spr-instruction = { workspace = true }
borsh = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
solana-address = { workspace = true }
solana-signature = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
# How mints and wallet utxos enter a zk circuit.
circuit = [
    "dep:ark-bn254",
    "dep:spr-zk-dsl",
    "dep:spr-zk-gadgets",
    "spr-keypair/circuit",
]
serde = ["dep:serde", "spr-keypair/serde"]
tsify = ["serde", "dep:tsify", "dep:wasm-bindgen", "spr-keypair/tsify"]

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen"]

[dev-dependencies]
criterion = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Pins the client address derivation to the on-chain `NewAddress::derive`.
spr-program = { path = "../program", features = ["compression"] }

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[[bench]]
name = "wallet_ops"
harness = false

[[test]]
name = "serde"
path = "tests/serde.rs"
required-features = ["serde"]
