[package]
name = "zolana-client"
version = "0.1.0"
description = "Client SDK for building, proving, and submitting Zolana private transactions."
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[features]
default = []
socks = ["reqwest/socks"]
indexer-api = ["dep:zolana-api"]
solana-rpc = ["dep:bs58", "dep:base64", "dep:solana-rpc-client", "dep:solana-commitment-config"]
client = ["indexer-api", "solana-rpc"]
# Gates the test binaries that spawn the local prover, so a plain
# `cargo test -p zolana-client` stays hermetic by construction.
proofs = []

[dependencies]
zolana-interface = { workspace = true }
zolana-program = { workspace = true }
zolana-indexer-api = { workspace = true }
zolana-event = { workspace = true }
zolana-event-parser = { workspace = true }
zolana-hasher = { workspace = true, features = ["std"] }
zolana-keypair = { workspace = true }
zolana-transaction = { workspace = true }
zolana-user-registry-interface = { workspace = true, features = ["solana"] }
zeroize = { workspace = true }
zolana-api = { workspace = true, optional = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
solana-address = { workspace = true }
p256 = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
ciborium = { workspace = true }
ciborium-ll = { workspace = true }
coset = { workspace = true }
dcap-qvl = { workspace = true }
hex = { workspace = true, features = ["serde"] }
hpke = { workspace = true }
httpdate = { workspace = true }
p384 = { workspace = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
x509-cert = { workspace = true }
solana-bn254 = { workspace = true }
groth16-solana = { workspace = true }
# The address-append verifying keys pin the proving keys batch proofs are
# checked against.
zolana-tree = { workspace = true, features = ["verify"] }
futures = { workspace = true }
async-trait = { workspace = true }
bs58 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
solana-account = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-rpc-client = { workspace = true, optional = true }
solana-commitment-config = { workspace = true, optional = true }
solana-pubkey = { workspace = true }
solana-transaction = { workspace = true, features = ["serde"] }
solana-transaction-status-client-types = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "macros", "sync"] }

[dev-dependencies]
base64 = { workspace = true }
# solana-rpc-client 4.1's send path. Kept so the v1 serde-order repro can
# call the same `bincode::serialize` that client used.
bincode = "=1.3.3"
borsh = { workspace = true }
bs58 = { workspace = true }
zolana-hasher = { workspace = true, features = ["std"] }
zolana-merkle-tree = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }
wincode = { workspace = true }
p384 = { workspace = true, features = ["alloc"] }
x509-cert = { workspace = true, features = ["builder"] }

[[test]]
name = "spendable"

[[test]]
name = "rpc"

# Hermetic: the prover proving-key startup check.
[[test]]
name = "proving_keys"

[[test]]
name = "transaction_size"

# Hermetic: the wallet spend input cap against the v1 ceilings.
[[test]]
name = "spend_input_ceiling"

# Hermetic: merge transactions built with compact padding against the v1 ceilings.
[[test]]
name = "merge_transaction_size"

# Hermetic: merge proof inputs built without a prover server.
[[test]]
name = "merge_inputs"

[[test]]
name = "indexer"
required-features = ["indexer-api"]

[[test]]
name = "client"
required-features = ["indexer-api"]

# Hermetic: pure witness assembly, no prover server, so no `proofs` gate.
[[test]]
name = "assembly_vectors"

# Hermetic: the public input hash vectors the TS SDK pins.
[[test]]
name = "public_input_hash_vectors"

# Hermetic: pure witness assembly across two input trees.
[[test]]
name = "multi_tree_spend"

# Hermetic: a loopback mock indexer, no prover server.
[[test]]
name = "witness_trees"

# Hermetic: a loopback mock prover, no prover server.
[[test]]
name = "prover_retry"

[[test]]
name = "transaction_proving"
required-features = ["proofs"]

[[test]]
name = "merge_proving"
path = "tests/merge/main.rs"
required-features = ["proofs"]

[[test]]
name = "ring_authority_proving"
path = "tests/ring_authority/main.rs"
required-features = ["proofs"]

[[test]]
name = "merge_ring_proving"
path = "tests/merge_ring/main.rs"
required-features = ["proofs"]

[[test]]
name = "ring_transfer_proving"
path = "tests/ring_transfer/main.rs"
required-features = ["proofs"]

[[test]]
name = "transfer_dummy"
required-features = ["proofs"]

[[test]]
name = "solana_rpc"

[[test]]
name = "user_registry"
