[package]
name = "spr-client"
version = "0.1.0"
description = "Client SDK for building, proving, and submitting Zolana private transactions."
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

publish = ["crates-io"]

[features]
default = ["reqwest"]
# The `reqwest` HTTP clients: the prover clients' `new` and `local`, proxies
# and the local prover launcher. Without it a prover client is built with
# `with_client` over the application's own transport. `solana-rpc` still
# links reqwest through `solana-rpc-client`.
reqwest = ["dep:reqwest", "spr-api/reqwest"]
socks = ["reqwest", "reqwest/socks"]
solana-rpc = ["dep:bs58", "dep:base64", "dep:solana-rpc-client", "dep:solana-commitment-config"]
client = ["solana-rpc"]
# Gates the test binaries that spawn the local prover, so a plain
# `cargo test -p spr-client` stays hermetic by construction.
proofs = ["reqwest"]

[dependencies]
bytemuck = { workspace = true }
spr-interface = { workspace = true }
spr-instruction = { workspace = true }
spr-indexer-api = { workspace = true }
spr-event = { workspace = true }
spr-event-parser = { workspace = true }
spr-hasher = { workspace = true, features = ["std"] }
spr-keypair = { workspace = true }
spr-transaction = { workspace = true }
spr-prover-tee = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }
zeroize = { workspace = true }
spr-api = { workspace = true, default-features = false }
num-bigint = { workspace = true }
num-traits = { workspace = true }
solana-address = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true, features = ["serde"] }
httpdate = { workspace = true }
rand_core = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solana-bn254 = { workspace = true }
groth16-solana = { workspace = true }
# The address-append verifying keys pin the proving keys batch proofs are
# checked against.
spr-tree = { workspace = true, features = ["verify"] }
futures = { workspace = true }
async-trait = { workspace = true }
bs58 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
solana-account = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-rpc-client = { workspace = true, optional = true }
solana-commitment-config = { workspace = true, optional = true }
solana-pubkey = { workspace = true }
solana-transaction = { workspace = true, features = ["serde"] }
solana-transaction-status-client-types = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "macros", "sync"] }

[dev-dependencies]
spr-instruction = { path = "../instruction", features = ["protocol"] }
tokio = { workspace = true, features = ["test-util"] }
spr-prover-tee = { path = "../prover-tee", features = ["test-fixtures"] }
aes-gcm = { workspace = true }
hpke = { workspace = true }
base64 = { workspace = true }
# solana-rpc-client 4.1's send path. Kept so the v1 serde-order repro can
# call the same `bincode::serialize` that client used.
bincode = "=1.3.3"
borsh = { workspace = true }
bs58 = { workspace = true }
spr-hasher = { path = "../../program-libs/hasher", default-features = false, features = ["std"] }
spr-merkle-tree = { path = "../merkle-tree" }
rand = { workspace = true }
serial_test = { workspace = true }
wincode = { workspace = true }

[[test]]
name = "scan"

[[test]]
name = "rpc"

# Hermetic: the prover proving-key startup check.
[[test]]
name = "proving_keys"

[[test]]
name = "transaction_size"

# Hermetic: the wallet spend input cap against the v1 ceilings.
[[test]]
name = "spend_input_ceiling"

# Hermetic: merge transactions built with compact padding against the v1 ceilings.
[[test]]
name = "merge_transaction_size"

[[test]]
name = "indexer"
required-features = ["reqwest"]

[[test]]
name = "client"
required-features = ["reqwest"]

# Hermetic: pure witness assembly, no prover server, so no `proofs` gate.
[[test]]
name = "assembly_vectors"

# Hermetic: the public input hash vectors the TS SDK pins.
[[test]]
name = "public_input_hash_vectors"

# Hermetic: pure witness assembly across two input trees.
[[test]]
name = "multi_tree_spend"

# Hermetic: a loopback mock indexer, no prover server.
[[test]]
name = "witness_trees"

# Hermetic: a merge refuses a witness from another tree before proving.
[[test]]
name = "merge_witness_tree"

# Hermetic: a loopback mock prover, no prover server.
[[test]]
name = "prover_retry"

# Hermetic: a fake HTTP client in place of a prover.
[[test]]
name = "prover_http_client"

# The archived default-deployment attestation is hermetic; the ignored test
# additionally generates and verifies one proof against the live devnet TEE.
[[test]]
name = "prover_default_tee"
required-features = ["reqwest"]

[[test]]
name = "transaction_proving"
required-features = ["proofs"]

[[test]]
name = "merge_proving"
path = "tests/merge/main.rs"
required-features = ["proofs"]

[[test]]
name = "ring_authority_proving"
path = "tests/ring_authority/main.rs"
required-features = ["proofs"]

[[test]]
name = "merge_ring_proving"
path = "tests/merge_ring/main.rs"
required-features = ["proofs"]

[[test]]
name = "ring_transfer_proving"
path = "tests/ring_transfer/main.rs"
required-features = ["proofs"]

[[test]]
name = "transfer_dummy"
required-features = ["proofs"]

[[test]]
name = "solana_rpc"

[[test]]
name = "user_registry"
