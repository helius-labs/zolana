[package]
name = "zolana-gnark-prover"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# The build helper and the examples' go.mod files reach the Go bridge and the
# pool circuits by repository-relative paths, so this only builds in-tree.
publish = false

[dependencies]
groth16-solana = { workspace = true, features = ["bsb22", "gnark-vk"] }
num-bigint = { workspace = true }
serde_json = { workspace = true }
solana-bn254 = { workspace = true }
thiserror = { workspace = true }
zolana-client = { workspace = true }
