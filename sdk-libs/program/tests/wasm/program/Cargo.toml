[package]
name = "zolana-program-wasm-test-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "wasm_test_program"
crate-type = ["cdylib", "rlib"]

[features]
circuits = []
r1cs-export = ["zolana-program/r1cs-export"]
wasm = ["zolana-program/wasm"]
wasm-prover = ["wasm", "zolana-program/wasm-prover"]
wasm-verify = ["wasm", "zolana-program/wasm-verify"]
fixtures = [
    "wasm",
    "zolana-program/setup",
    "zolana-program/parallel",
]
snarkjs = ["fixtures"]

[dependencies]
xark = { workspace = true }
borsh = { workspace = true }
solana-address = { workspace = true }
zolana-program = { workspace = true, features = ["client"] }

[dev-dependencies]
zolana-keypair = { workspace = true, features = ["serde"] }
zolana-transaction = { workspace = true, features = ["serde"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-signature = { workspace = true }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true }

[[test]]
name = "fixtures"
required-features = ["fixtures"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd", "--enable-threads", "--enable-bulk-memory", "--enable-mutable-globals"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)', 'cfg(xark_client)'] }

[lints.clippy]
disallowed_types = "allow"
