[package]
name = "spr-program-wasm-test-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "wasm_test_program"
crate-type = ["cdylib", "rlib"]

[features]
circuits = []
build-circuits = ["spr-program/build"]
wasm = ["spr-program/wasm"]
wasm-prover = ["wasm", "spr-program/wasm-prover"]
wasm-verify = ["wasm", "spr-program/wasm-verify"]
fixtures = ["wasm"]

[dependencies]
xark = { workspace = true }
borsh = { workspace = true }
solana-address = { workspace = true }
spr-program = { workspace = true, features = ["client"] }

[dev-dependencies]
spr-keypair = { workspace = true, features = ["serde"] }
spr-transaction = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-signature = { workspace = true }
spr-hasher = { workspace = true }
spr-interface = { workspace = true }

[[test]]
name = "fixtures"
required-features = ["fixtures"]

# Used only by macro expansions: #[input] expands to Xark code.
[package.metadata.cargo-machete]
ignored = ["xark"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd", "--enable-threads", "--enable-bulk-memory", "--enable-mutable-globals"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)', 'cfg(xark_client)'] }

[lints.clippy]
disallowed_types = "allow"
