[package]
name = "spr-program"
version = "0.8.0"
description = "SPP SDK for Solana programs: the spr-instruction builders and derivations, compressed accounts, and ZK programs with their circuits, proofs and transaction client."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]

[dependencies]
borsh = { workspace = true, optional = true }
groth16-solana = { workspace = true, optional = true }
pinocchio = { workspace = true, features = ["cpi"], optional = true }
solana-address = { workspace = true }
solana-program-error = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
solana-signature = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
wincode = { workspace = true }
zeroize = { workspace = true, optional = true }
spr-hasher = { workspace = true }
spr-instruction = { workspace = true }
spr-interface = { workspace = true }
spr-macros = { version = "0.8.0", path = "../macros", optional = true, default-features = false }
spr-circuit = { workspace = true, optional = true }
spr-tree = { workspace = true, optional = true }

[target.'cfg(all(not(xark), not(xark_client)))'.dependencies]
js-sys = { workspace = true, optional = true }
ark-bn254 = { version = "0.6", optional = true }
ark-serialize = { version = "0.6", optional = true }
ark-ec = { version = "0.6", optional = true }
solana-bn254 = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
spr-keypair = { workspace = true, optional = true }
spr-transaction = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", not(xark), not(xark_client)))'.dependencies]
xark-wasm = { workspace = true, optional = true }

[features]
default = []
# The shielded pool's transact instruction as a signed CPI from a pinocchio
# program.
cpi = ["spr-instruction/cpi"]
compression = ["cpi", "dep:borsh", "dep:pinocchio", "dep:spr-tree", "dep:thiserror"]
# Experimental: `ShieldedPda`, a shielded identity owned by a program-derived
# address. Needs `std`, since it links `spr-keypair`; `client` includes it.
shielded-pda = ["dep:spr-keypair", "dep:zeroize"]
circuit = ["dep:spr-circuit", "dep:spr-macros", "dep:borsh"]
client = ["circuit", "verifier", "shielded-pda", "borsh/std", "dep:spr-transaction", "dep:sha2", "dep:serde_json", "dep:ark-bn254", "dep:ark-serialize", "dep:ark-ec", "dep:solana-bn254", "solana-address/curve25519"]
build = ["circuit", "dep:serde", "dep:serde_json"]
verifier = ["dep:groth16-solana", "dep:solana-program-error"]
serde = ["client", "dep:serde", "spr-keypair/serde", "spr-transaction/serde", "spr-circuit/serde"]
tsify = ["serde", "dep:tsify", "dep:wasm-bindgen", "spr-keypair/tsify", "spr-transaction/tsify", "spr-circuit/tsify"]
wasm = ["client", "tsify", "dep:serde-wasm-bindgen", "dep:js-sys"]
wasm-prover = ["wasm", "dep:xark-wasm"]
wasm-verify = ["wasm"]

[dev-dependencies]
xark = { workspace = true }
xark-groth16 = { workspace = true }
borsh = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
spr-account-checks = { workspace = true, features = ["test-only"] }
spr-client = { workspace = true }
spr-keypair = { workspace = true }
spr-transaction = { workspace = true }
spr-tree = { workspace = true }

[[test]]
name = "shielded_pda"
required-features = ["shielded-pda"]

[[test]]
name = "client_data_decode"
required-features = ["client"]

[[test]]
name = "client_inputs"
required-features = ["client"]

[[test]]
name = "client_inputs_wasm"
required-features = ["wasm"]

[[test]]
name = "proof_encoding"
required-features = ["client"]

[[test]]
name = "finalize"
required-features = ["client"]

[[test]]
name = "verifier_public_hash"
required-features = ["client"]

[lints.clippy]
disallowed_types = "allow"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
