[package]
name = "zolana-program"
version = "0.1.0"
description = "SPP SDK for Solana programs: the zolana-instruction builders and derivations, compressed accounts, and ZK programs with their circuits, proofs and transaction client."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
borsh = { workspace = true, optional = true }
groth16-solana = { workspace = true, optional = true }
pinocchio = { workspace = true, features = ["cpi"], optional = true }
solana-address = { workspace = true }
solana-program-error = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
solana-signature = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
wincode = { workspace = true }
zolana-hasher = { workspace = true }
zolana-instruction = { workspace = true }
zolana-interface = { workspace = true }
zolana-macros = { path = "../macros", optional = true, default-features = false }
zolana-circuit = { workspace = true, optional = true }
zolana-tree = { workspace = true, optional = true }

[target.'cfg(all(not(xark), not(xark_client)))'.dependencies]
ark-bn254 = { version = "0.6", optional = true }
ark-ff = { version = "0.6", optional = true }
ark-serialize = { version = "0.6", optional = true }
xark-groth16 = { git = "https://github.com/blueshift-gg/xark", rev = "b443d83ea8ec7f2253610887e9690623ad048aef", optional = true }
solana-bn254 = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
zolana-keypair = { workspace = true, optional = true }
zolana-transaction = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", not(xark), not(xark_client)))'.dependencies]
xark-wasm = { git = "https://github.com/blueshift-gg/xark", rev = "b443d83ea8ec7f2253610887e9690623ad048aef", optional = true }

[features]
default = []
protocol-instructions = ["zolana-instruction/protocol"]
cpi = ["zolana-instruction/cpi"]
compression = ["cpi", "dep:borsh", "dep:pinocchio", "dep:zolana-tree", "dep:thiserror"]
circuit = ["dep:zolana-circuit", "dep:zolana-macros", "dep:borsh"]
client = ["circuit", "verifier", "dep:zolana-keypair", "dep:zolana-transaction", "dep:sha2", "dep:serde_json", "dep:ark-bn254", "dep:ark-serialize", "dep:xark-groth16", "dep:solana-bn254", "solana-address/curve25519"]
setup = ["client", "dep:serde_json"]
parallel = ["client"]
build = ["setup", "dep:serde"]
r1cs-export = ["build"]
verifier = ["dep:groth16-solana", "dep:solana-program-error"]
serde = ["client", "dep:serde", "zolana-keypair/serde", "zolana-transaction/serde"]
tsify = ["serde", "dep:tsify", "dep:wasm-bindgen", "zolana-keypair/tsify", "zolana-transaction/tsify"]
wasm = ["client", "tsify", "dep:serde-wasm-bindgen"]
wasm-prover = ["wasm", "dep:xark-wasm"]
wasm-threads = ["wasm-prover"]
wasm-verify = ["wasm"]
external-tools = []
test-support = ["client"]

[dev-dependencies]
ark-circom = { version = "0.6.0", default-features = false }
borsh = { workspace = true }
groth16-solana = { workspace = true, features = ["gnark-vk"] }
hex = { workspace = true }
num-bigint = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wasmer = { version = "6.1", default-features = false }
zolana-account-checks = { workspace = true, features = ["test-only"] }
zolana-client = { workspace = true }
zolana-event = { workspace = true }
zolana-keypair = { workspace = true }
zolana-transaction = { workspace = true }
zolana-tree = { workspace = true }

[[test]]
name = "owner_records"
required-features = ["client", "setup"]

[[test]]
name = "client_data_decode"
required-features = ["client"]

[[test]]
name = "unit"
required-features = ["test-support", "setup"]

[[test]]
name = "external_gadget"
required-features = ["test-support", "setup"]

[[test]]
name = "scenarios"
required-features = ["test-support", "setup", "compression"]

[lints.clippy]
disallowed_types = "allow"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
