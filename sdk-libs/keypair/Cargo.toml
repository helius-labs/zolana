[package]
name = "zolana-keypair"
version = "0.1.0"
description = "TSPP client keypairs: signing, nullifier, and viewing keys with HPKE-style encryption and view-tag derivation."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
p256 = { workspace = true }
bs58 = { workspace = true }
ed25519-dalek = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
zolana-hasher = { workspace = true, features = ["std"] }
rand = { workspace = true }
solana-address = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
serde = ["dep:serde", "dep:serde_bytes"]
tsify = ["serde", "dep:tsify", "dep:wasm-bindgen"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
solana-address = { workspace = true }
aws-sdk-kms = { workspace = true, features = ["test-util"] }
aws-smithy-mocks = { workspace = true }
tokio = { workspace = true, features = ["time"] }
solana-keypair = { workspace = true, features = ["seed-derivable"] }
solana-derivation-path = { workspace = true }
solana-seed-phrase = { workspace = true }
ed25519-dalek-bip32 = { workspace = true }

[[test]]
name = "keypair"
path = "tests/keypair.rs"

[[test]]
name = "hsm_backends"
path = "tests/hsm_backends.rs"

[[test]]
name = "seed_based_keypair"
path = "tests/seed_based_keypair.rs"

[[test]]
name = "vectors"
path = "tests/vectors.rs"

[[test]]
name = "serde"
path = "tests/serde.rs"
required-features = ["serde"]
