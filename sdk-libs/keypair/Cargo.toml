[package]
name = "zolana-keypair"
version = "0.1.0"
description = "TSPP client keypairs: signing, nullifier, and viewing keys with HPKE-style encryption and view-tag derivation."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
zolana-hasher = { workspace = true, features = ["poseidon", "std"] }
rand = { workspace = true }
solana-address = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
solana-address = { workspace = true }
aws-sdk-kms = { version = "1", features = ["test-util"] }
aws-smithy-mocks = "0.3"
tokio = { workspace = true, features = ["time"] }
solana-keypair = { workspace = true, features = ["seed-derivable"] }
solana-derivation-path = "3.0.0"
solana-seed-phrase = "3.0.0"
ed25519-dalek-bip32 = "0.3.0"

[[test]]
name = "keypair"
path = "tests/keypair.rs"

[[test]]
name = "hsm_backends"
path = "tests/hsm_backends.rs"

[[test]]
name = "seed_based_keypair"
path = "tests/seed_based_keypair.rs"
