[package]
name = "zolana-wallet"
version = "0.1.0"
description = "Zolana wallet SDK: syncing, balances, transaction-building actions, wallet authority, and the user registry."
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
zolana-client = { workspace = true, features = ["indexer-api"] }
zolana-event = { workspace = true }
zolana-event-parser = { workspace = true }
zolana-interface = { workspace = true, features = ["solana"] }
zolana-user-registry-interface = { workspace = true, features = ["solana"] }
zolana-keypair = { workspace = true }
zolana-transaction = { workspace = true }
borsh = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
solana-address = { workspace = true }
solana-account = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true, features = ["serde"] }
rayon = { workspace = true, optional = true }

[features]
parallel = ["dep:rayon"]

[dev-dependencies]
bytemuck = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
rand = { workspace = true }
p256 = { workspace = true }
num-bigint = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
zolana-hasher = { workspace = true, features = ["std"] }
zolana-merkle-tree = { workspace = true }

[[test]]
name = "transaction"

[[test]]
name = "wallet_unified"

[[test]]
name = "wallet_history"

[[test]]
name = "wallet_prop"

[[test]]
name = "wallet_proofless"

[[test]]
name = "wallet_behavior"

[[test]]
name = "remote_authority"

[[test]]
name = "tamper"

[[test]]
name = "bench_scenarios"

[[bench]]
name = "wallet_ops"
harness = false
