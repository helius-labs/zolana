[package]
name = "spr-macros"
version = "0.8.0"
description = "Derive macros for SPR zero-knowledge programs."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
spr-hasher = { workspace = true }
syn = { workspace = true }
spr-zk-macros-core = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
anchor-syn = "1.1"
borsh = { workspace = true }
solana-address = { workspace = true }
solana-signature = { workspace = true }
trybuild = "1"
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-program = { path = "../program", features = ["test-support", "setup", "parallel"] }
spr-transaction = { workspace = true }

[lints.clippy]
disallowed_types = "allow"
