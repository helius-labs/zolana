[package]
name = "spr-macros"
version = "0.8.0"
description = "Derive macros for SPR zero-knowledge programs."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
spr-hasher = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
anchor-syn = "1.1"
prettyplease = "0.2"
trybuild = "1"
spr-program = { path = "../program", features = ["client"] }
# The trybuild fixtures declare #[input] structs, which expand to Xark code.
xark = { workspace = true }

[lints.clippy]
disallowed_types = "allow"
