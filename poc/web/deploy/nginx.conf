proxy_cache_path /var/cache/nginx/keys levels=1:2 keys_zone=keys:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # On every response, a dedicated worker script needs the same policy as its document.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    gzip on;
    gzip_types application/javascript text/css application/json application/wasm;

    location = /keys/manifest.json {
        expires -1;
    }

    # CloudFront sends no CORS headers, so keys are read same-origin. __KEYS_PREFIX__ is the
    # lockfile's pinned key version, substituted at image build.
    location /keys/ {
        proxy_pass https://d3gbdb0egjwcw9.cloudfront.net/__KEYS_PREFIX__/;
        proxy_set_header Host d3gbdb0egjwcw9.cloudfront.net;
        proxy_ssl_server_name on;
        proxy_cache keys;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        expires 30d;
    }

    # Devnet's indexer and prover are plaintext HTTP, unreachable from an HTTPS page.
    location = /devnet/indexer {
        proxy_pass http://zolnet-devnet-1779374825.eu-north-1.elb.amazonaws.com/;
    }
    location /devnet/indexer/ {
        proxy_pass http://zolnet-devnet-1779374825.eu-north-1.elb.amazonaws.com/;
    }
    location /devnet/prover/ {
        proxy_pass http://zolnet-devnet-1779374825.eu-north-1.elb.amazonaws.com:3001/;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
    }

    location /prover/ {
        expires 1d;
    }

    location / {
        try_files $uri /index.html;
    }
}
