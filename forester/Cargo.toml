[package]
name = "forester"
version = "1.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = "0.15"

# Solana client + transaction building.
solana-account = { workspace = true }
solana-commitment-config = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }

# Shielded-pool interface for instruction-data shapes and builders.
spr-interface = { workspace = true }
spr-program = { workspace = true, features = ["protocol-instructions"] }

# Tree + nullifier-queue state for the read-only `info` report.
spr-tree = { workspace = true }

# `run`: reconstruct the reference nullifier tree, build address-append
# witnesses, and prove them on the forester prover.
spr-client = { workspace = true }
spr-api = { workspace = true, features = ["reqwest"] }
spr-merkle-tree = { workspace = true }
spr-hasher = { workspace = true }
spr-smart-account-client = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
