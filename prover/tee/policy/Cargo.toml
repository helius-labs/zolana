[package]
name = "spr-tee-policy"
version = "0.1.0"
description = "Builds, signs and verifies the signed TEE prover policy, and keeps it fresh."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tee-policy"
path = "src/bin/tee-policy.rs"

[[bin]]
name = "tee-policy-freshness"
path = "src/bin/tee-policy-freshness.rs"

[dependencies]
anyhow = { workspace = true }
aws-config = { workspace = true }
aws-sdk-cloudwatch = { workspace = true }
aws-sdk-kms = { workspace = true }
aws-sdk-s3 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
lambda_runtime = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spr-prover-tee = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
spr-prover-tee = { workspace = true, features = ["test-fixtures"] }
