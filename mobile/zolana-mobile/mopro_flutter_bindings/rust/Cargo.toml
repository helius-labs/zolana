[dependencies]
flutter_rust_bridge = "=2.11.1"

[dependencies.zolana-mobile]
default-features = false
features = ["flutter"]
path = "../.."
version = "0.1.0"

[build-dependencies]
cc = "=1.2.16"

[lib]
crate-type = [
    "cdylib",
    "staticlib",
]

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(frb_expand)"]
level = "warn"

[package]
edition = "2021"
name = "mopro_flutter_bindings"
version = "0.1.0"

[workspace]
