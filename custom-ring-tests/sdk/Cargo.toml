[package]
name = "custom-ring-sdk"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
custom-ring-program = { path = "../program" }
custom-ring-prover = { path = "../prover" }
# Only for the uncompressed SEC1 encoding of the auditor key that the circuit
# witnesses; `zolana-keypair` hands out compressed keys.
p256 = { workspace = true }
solana-address = { workspace = true, features = ["curve25519"] }
solana-instruction = { workspace = true }
# The program crate's canonical public-input hashing fails with this error type
# (pinocchio re-exports it), so the sdk names it to wrap it.
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
zeroize = { workspace = true }
# `solana` pulls in the instruction builders this crate wraps for ring deposits.
zolana-interface = { workspace = true, features = ["solana"] }
zolana-keypair = { workspace = true }
zolana-ring-client = { workspace = true }

[dev-dependencies]
groth16-solana = { workspace = true, features = ["bsb22", "gnark-vk"] }
hex = { workspace = true }
