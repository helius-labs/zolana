[package]
name = "custom-ring-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "custom_ring_program"
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
# Toggleable smoke feature of the template: every instruction logs a greeting.
hello = []

[dependencies]
bincode = { workspace = true }
# `min_const_generics`: without it bytemuck only implements Pod/Zeroable for
# arrays up to 32 elements, and `RingProgramConfig` holds the 33-byte
# SEC1-compressed auditor key. The feature is purely additive.
bytemuck = { workspace = true, features = ["min_const_generics"] }
# `bsb22`: the auditor circuit's emulated P256 arithmetic adds one BSB22
# commitment, so its proofs verify through `Groth16Verifier::new_with_commitment`.
groth16-solana = { workspace = true, features = ["bsb22"] }
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-system = { workspace = true }
solana-loader-v3-interface = { workspace = true, features = ["serde"] }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
zolana-account-checks = { workspace = true }
zolana-hasher = { workspace = true, features = ["poseidon"] }
zolana-interface = { workspace = true, features = ["solana"] }

[build-dependencies]
bs58 = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
mollusk-svm = { workspace = true }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-program-error = { workspace = true }
solana-pubkey = { workspace = true }
zolana-test-utils = { workspace = true, features = ["mollusk"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
