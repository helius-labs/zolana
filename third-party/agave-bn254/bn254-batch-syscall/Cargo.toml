[package]
name = "solana-bn254-batch-syscall"
description = "Shim: sources are ../agave/bn254-batch-syscall (not vendored)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["agave-unstable-api"]
agave-unstable-api = []

[dependencies]
bytemuck = { workspace = true, features = ["min_const_generics"] }
bytemuck_derive = "1.8"
thiserror = { workspace = true }

[target.'cfg(not(target_os = "solana"))'.dependencies]
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }

[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = { workspace = true }

[dev-dependencies]
ark-std = { workspace = true }
solana-bn254 = { workspace = true }
solana-keccak-hasher = { workspace = true, features = ["sha3"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']
