name: Setup Rust
description: Install the workspace Rust toolchain, warm the Cargo cache, and (optionally) install `just`. Run after actions/checkout.

inputs:
  shared-key:
    description: Swatinem rust-cache shared-key for cross-workflow cache reuse.
    required: false
    default: rust-workspace
  install-just:
    description: Install the `just` task runner via taiki-e/install-action.
    required: false
    default: "true"
  private-libs-token:
    description: |
      GitHub token with read access to helius-labs/privacy-program-libs (and any
      other private repos referenced as cargo git deps). The workflow-issued
      GITHUB_TOKEN only scopes to the current repo, so private cross-repo
      dependencies need a PAT or fine-grained token passed in via secrets.
    required: false
    default: ""
  agave-pin:
    description: |
      Commit of the Atamanov/agave fork that third-party/agave-bn254 symlinks
      into. The workspace does not compile without a sibling checkout at this
      pin. Set to "" to skip the clone.
    required: false
    default: "7090028bb328e63b5207e35cfcea864728fea0b7"

runs:
  using: composite
  steps:
    - if: inputs.private-libs-token != ''
      name: Configure git auth for private cargo git deps
      shell: bash
      env:
        TOKEN: ${{ inputs.private-libs-token }}
      run: |
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
    - if: inputs.agave-pin != ''
      name: Clone the agave fork at the pin
      shell: bash
      env:
        AGAVE_PIN: ${{ inputs.agave-pin }}
      run: |
        agave_dir="${GITHUB_WORKSPACE}/../agave"
        if [ ! -d "$agave_dir/.git" ]; then
          git clone --depth 1 --branch helius/bn254-b1-zolana-pin \
            https://github.com/Atamanov/agave.git "$agave_dir"
        fi
        head=$(git -C "$agave_dir" rev-parse HEAD)
        if [ "$head" != "$AGAVE_PIN" ]; then
          echo "agave checkout is at $head, expected $AGAVE_PIN" >&2
          exit 1
        fi
    - name: Install workspace Rust toolchain
      shell: bash
      run: rustup show active-toolchain
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - if: inputs.install-just == 'true'
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
      with:
        tool: just
