name: aggregate tiers

# The tiers below prove against outer keys (aggregate batches, merge chains,
# nullifier folds) that are neither published nor pinned by
# proving-keys.lock, so the runner must sample them itself. Setup takes the
# larger part of the run and rewrites the committed verifying-key constants it
# pins, which is why these tiers stay off the per-pull-request workflow and
# why no working-tree check runs here.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Recipe to run
        required: true
        type: choice
        options:
          - test-aggregate
          - test-nullifier-fold
          - test-ring-validator-aggregate-cu
          - test-swap-batch
          - test-vk-registry-aggregate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  SBF_TOOLS_VERSION: v1.54
  NEXTEST_PROFILE: ci

jobs:
  tier:
    name: ${{ inputs.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AGAVE_VERSION: v4.0.2
      # For the gh-release swap key download (ensure-swap-keys). The inner keys
      # the outer setup builds on come from CloudFront and need no token.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: aggregate
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install Anza CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install pinned SBF platform tools
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only
      - name: Cache Squads smart account binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: squads-cache
        with:
          path: target/deploy/squads_smart_account_program.so
          key: squads-smart-account-SMRTzfY6DfH5ik3TKiyLFfXexV8uSG3d2UksSCYdunG
      - name: Fetch Squads smart account binary
        if: steps.squads-cache.outputs.cache-hit != 'true'
        run: just fetch-smart-account
      - run: just ${{ inputs.tier }}
      - name: Dump prover and photon logs on failure
        if: failure()
        run: |
          echo "=== prover-server.log ==="
          find . -name prover-server.log -exec sh -c 'echo "--- {} ---"; tail -200 "{}"' \; 2>/dev/null \
            || echo "(no prover log)"
          echo "=== photon log ==="
          find . -name photon.log -exec sh -c 'echo "--- {} ---"; tail -100 "{}"' \; 2>/dev/null \
            || echo "(no photon log)"
