name: rust

on:
  push:
    branches: [main]
    paths-ignore:
      - "prover/server/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "prover/server/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  SBF_TOOLS_VERSION: v1.54
  # Activate .config/nextest.toml's [profile.ci]: retries = 2 (flaky localnet /
  # prover tests get two retries, reported FLAKY on pass) and fail-fast = false.
  NEXTEST_PROFILE: ci

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure git auth for private cargo git deps
        env:
          TOKEN: ${{ secrets.PRIVATE_LIBS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install workspace Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: ./tools/check-test-hygiene.sh

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: machete
          install-just: "false"
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-machete
      - run: cargo machete --skip-target-dir

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just clippy

  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just check-all

  test-cli:
    name: tests / cli
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just test-cli

  test-shielded-pool:
    name: tests / shielded-pool
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      AGAVE_VERSION: v4.0.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: litesvm
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install pinned SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - run: just test-program-fast

  test-sdk-libs:
    name: tests / sdk-libs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just test-sdk-libs

  test-programs:
    name: tests / programs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      AGAVE_VERSION: v4.0.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: programs
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install pinned SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - run: just test-program-proofs-programs-only

  test-custom-ring:
    name: tests / custom-ring
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: custom-ring
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: custom-ring-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - run: just test-custom-ring
      # No key recipe may rewrite the committed verifying keys.
      - run: git diff --exit-code -- custom-rings/interface/src

  build-photon:
    name: build / photon
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Cache the photon binary
        id: photon-bin-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/release/photon
          key: photon-bin-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'services/photon/**', 'program-libs/account-checks/**', 'program-libs/event/**', 'program-libs/hasher/**', 'program-libs/interface/**', 'program-libs/tree/**', 'sdk-libs/indexer-api/**') }}
      - uses: ./.github/actions/setup-rust
        if: steps.photon-bin-cache.outputs.cache-hit != 'true'
        with:
          install-just: "false"
          shared-key: localnet-photon
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - if: steps.photon-bin-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release -p photon-indexer --bin photon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photon-linux-x86_64-${{ github.sha }}
          path: target/release/photon
          if-no-files-found: error
          retention-days: 1

  build-localnet-tests:
    name: build / localnet suites
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      AGAVE_VERSION: v4.0.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: localnet-photon
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install pinned SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - run: just build-localnet-archives
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localnet-tests-${{ github.sha }}
          path: |
            target/nextest-archives/
            target/deploy/*.so
            target/debug/zolana
            target/debug/xtask
            target/prover-server
          if-no-files-found: error
          retention-days: 1

  test-localnet-photon:
    name: tests / localnet photon / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: [build-photon, build-localnet-tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e
            recipe: test-localnet-e2e-photon
            runner: ubuntu-latest
          - name: spp lifecycle/decode
            recipe: test-spp-validator-lifecycle-decode
            runner: ubuntu-latest
          - name: spp merge
            recipe: test-spp-validator-merge
            runner: ubuntu-latest
          - name: spp randomized
            recipe: test-spp-validator-randomized
            runner: ubuntu-latest
          - name: spp proof cu
            recipe: test-spp-validator-proof-cu
            runner: ubuntu-latest
          - name: ring lifecycle
            recipe: test-ring-validator
            runner: ubuntu-latest
          - name: swap and escrow lifecycle
            recipe: test-swap-and-escrow-validator
            runner: ubuntu-latest
          - name: dynamic-swap lifecycle
            recipe: test-dynamic-swap
            runner: ubuntu-latest
          - name: compression lifecycle
            recipe: test-compression-validator
            runner: ubuntu-latest
          - name: custom-ring lifecycle
            recipe: test-custom-ring-validator
            runner: ubuntu-latest
          - name: custom-ring shared sources
            recipe: test-custom-ring-shared
            runner: ubuntu-latest
          - name: custom-ring policy rules
            recipe: test-custom-ring-rules
            runner: ubuntu-latest
          - name: custom-ring policy re-pin
            recipe: test-custom-ring-repin
            runner: ubuntu-latest
          - name: rfq settlement
            recipe: test-rfq-validator
            runner: ubuntu-latest
    env:
      AGAVE_VERSION: v4.0.2
      # GH_TOKEN is for the gh-release swap/escrow/custom-ring key downloads
      # (ensure-swap-keys / ensure-escrow-keys / ensure-custom-ring-keys); SPP
      # proving keys come from CloudFront and need no token.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZOLANA_PHOTON_BIN: target/bin/photon
      ZOLANA_PREBUILT: "1"
      ZOLANA_XTASK_BIN: target/debug/xtask
      ZOLANA_NEXTEST_ARCHIVE_DIR: target/nextest-archives
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: localnet-photon
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install pinned SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - name: Download workspace Photon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: photon-linux-x86_64-${{ github.sha }}
          path: target/bin
      - run: chmod 0755 "$ZOLANA_PHOTON_BIN"
      - name: Download prebuilt localnet suites
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localnet-tests-${{ github.sha }}
          path: target
      - run: chmod 0755 target/debug/zolana target/debug/xtask target/prover-server
      - name: Cache Squads smart account binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: squads-cache
        with:
          path: target/deploy/squads_smart_account_program.so
          key: squads-smart-account-SMRTzfY6DfH5ik3TKiyLFfXexV8uSG3d2UksSCYdunG
      - name: Fetch Squads smart account binary
        if: steps.squads-cache.outputs.cache-hit != 'true'
        run: just fetch-smart-account
      - run: just ${{ matrix.recipe }}
      - name: Dump prover and photon logs on failure
        if: failure()
        run: |
          # Services log under a test-ledger dir whose location depends on the
          # spawning process's cwd, so search rather than assume the repo root.
          echo "=== prover-server.log ==="
          find . -name prover-server.log -exec sh -c 'echo "--- {} ---"; tail -200 "{}"' \; 2>/dev/null \
            || echo "(no prover log)"
          echo "=== photon log ==="
          find . -name photon.log -exec sh -c 'echo "--- {} ---"; tail -100 "{}"' \; 2>/dev/null \
            || echo "(no photon log)"

  test-user-registry-litesvm:
    name: tests / user-registry litesvm
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      AGAVE_VERSION: v4.0.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: litesvm
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install pinned SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - run: just test-user-registry-litesvm

  # Line/region coverage over the library and binary crates: the program-libs,
  # the SDK crates, the CLI, forester, and photon. Informational — it renders a
  # summary table into the run's job summary and uploads lcov/HTML reports, but
  # there is no `--fail-under-lines` gate yet; add one when the team picks a
  # target. The on-chain programs, the test/example crates, and xtask are
  # excluded, and zolana-client is collected `--lib` only, so the job stays
  # hermetic — no prover, validator, or database. See tools/coverage-packages.py
  # for what is measured and why. Code executed inside the SVM is not measured.
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: coverage
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-llvm-cov
      # Collect once, then re-render from the same profile data, so the extra
      # formats are nearly free.
      - run: just coverage --lcov --output-path lcov.info
      - name: Render coverage reports
        run: |
          just coverage-report --html --output-dir coverage-html
          just coverage-report --json --summary-only --output-path coverage.json
      - name: Publish coverage summary
        run: python3 tools/coverage-summary.py coverage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json
            coverage-html
          if-no-files-found: error

  test-client-integration:
    name: tests / client integration
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      # Cache the keys dir across runs, keyed by the lockfile so a key rotation
      # invalidates it; the prover re-verifies cached keys against the lock on use.
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - run: just test-client-integration

