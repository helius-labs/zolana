name: Release automation checks

on:
  pull_request:
    paths:
      - ".github/workflows/publish-*.yml"
      - ".github/workflows/release-checks.yml"
      - "tools/*release*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-*.yml"
      - ".github/workflows/release-checks.yml"
      - "tools/*release*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 -B -m unittest discover -s tools -p 'test_release_changes.py'
      # GitHub supports queue:max; actionlint has not added that field yet.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -ignore=unexpected.key.*queue.*concurrency.*section .github/workflows/publish-image.yml .github/workflows/publish-service-image.yml .github/workflows/publish-nitro.yml .github/workflows/release-checks.yml
