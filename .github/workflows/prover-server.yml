name: prover-server

on:
  push:
    branches: [main]
    paths:
      - "prover/**"
      - ".github/workflows/prover-server.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "prover/**"
      - ".github/workflows/prover-server.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: prover-server / go test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # gnark circuit compilation across the full TestCombined / TestInclusion /
    # TestNonInclusion / batch_* CSV fixtures can take ~30-45 min; allow
    # headroom but cap so a runaway test fails fast.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: extractions/setup-just@v2
      - run: just prover-server-test
