name: typescript

on:
  push:
    branches: [main]
    paths-ignore:
      - "protocol-ops/**"
      - ".github/workflows/protocol-ops.yml"
  pull_request:
    paths-ignore:
      - "protocol-ops/**"
      - ".github/workflows/protocol-ops.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  SBF_TOOLS_VERSION: v1.54

jobs:
  check:
    name: typescript / check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:ts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:tee-fleet
      - run: node --test tools/tee-fleet/*.test.mjs
        env:
          ZOLANA_TEST_BROWSER: firefox
      - run: node --test tools/tee-fleet/*.test.mjs
        env:
          ZOLANA_TEST_BROWSER: webkit
      - run: npm run docs:ts
      - name: Verify the published package
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npm pack --workspace @heliuslabs/zolana --pack-destination "$tmp"
          set -- "$tmp"/*.tgz
          test "$#" -eq 1
          tarball="$1"
          printf '{"private":true,"type":"module"}\n' > "$tmp/package.json"
          kit_range="$(node -p "require('./sdk-libs/ts/package.json').peerDependencies['@solana/kit']")"
          npm --prefix "$tmp" install "$tarball" "@solana/kit@$kit_range" "@types/node@^24" --ignore-scripts
          cp test-vectors/tee_tuf_repository.json "$tmp/tee-vectors.json"
          cat > "$tmp/smoke.mts" <<'TS'
          import { createZolanaClient, type ZolanaClientConfig } from "@heliuslabs/zolana";
          import { tufTeePolicy, type BrowserTufTeePolicyOptions } from "@heliuslabs/zolana/tee/browser";
          import type { TeePolicySource } from "@heliuslabs/zolana/client";
          const browserFactory: (options: BrowserTufTeePolicyOptions) => TeePolicySource = tufTeePolicy;
          void browserFactory;
          const config: ZolanaClientConfig = {
            solanaRpcUrl: new URL("http://127.0.0.1:8899"),
            indexerUrl: undefined,
            proverUrl: undefined,
          };
          await createZolanaClient(config);
          TS
          ./node_modules/.bin/tsc \
            --noEmit --strict --exactOptionalPropertyTypes --skipLibCheck false \
            --target es2022 --module nodenext --moduleResolution nodenext \
            "$tmp/smoke.mts"
          node --input-type=module - "$tmp" <<'BUNDLE'
          import { build } from "esbuild";
          const result = await build({
            stdin: { contents: 'export { tufTeePolicy } from "@heliuslabs/zolana/tee/browser";', resolveDir: process.argv[2] },
            bundle: true, platform: "browser", format: "esm", write: false, metafile: true,
          });
          if (Object.values(result.metafile.outputs).some((output) => output.imports.length)) {
            throw new Error("packed browser provider must bundle without external/Node imports");
          }
          BUNDLE
          (
            cd "$tmp"
            node --input-type=module <<'NODE'
          const sdk = await import("@heliuslabs/zolana");
          const instructions = await import("@heliuslabs/zolana/instructions");
          const client = await import("@heliuslabs/zolana/client");
          const browser = await import("@heliuslabs/zolana/tee/browser");
          const { readFileSync } = await import("node:fs");
          const vector = JSON.parse(readFileSync("tee-vectors.json", "utf8"));
          const source = browser.tufTeePolicy({
            network: vector.network, rootJson: vector.bootstrap_root,
            metadataUrl: "https://policy.test/metadata/", targetsUrl: "https://policy.test/targets/",
          });
          if (!client.TeePolicySource.isSource(source)) throw new Error("browser source identity differs from client");
          await Promise.all(
            ["addresses", "client", "interface", "internal", "keypair", "transaction", "wallet"].map(
              (subpath) => import(`@heliuslabs/zolana/${subpath}`),
            ),
          );
          if (!sdk.buildTransferTransaction || !instructions.getDepositInstructionAsync) process.exit(1);
          await sdk.createZolanaClient({
            solanaRpcUrl: "http://127.0.0.1:8899",
          });
          NODE
          )

  e2e:
    name: typescript / e2e
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 120
    env:
      AGAVE_VERSION: v4.2.2
      # Independent of the local prover URL that just test-ts-e2e supplies.
      ZOLANA_TEE_PROVER_URL: ${{ vars.ZOLANA_TEE_PROVER_URL }}
      ZOLANA_TEE_PROVER_POLICY: ${{ github.workspace }}/${{ vars.ZOLANA_TEE_PROVER_POLICY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check live TEE test configuration
        env:
          POLICY_PATH: ${{ vars.ZOLANA_TEE_PROVER_POLICY }}
        run: |
          test -n "$ZOLANA_TEE_PROVER_URL"
          test -n "$POLICY_PATH"
          test -f "$ZOLANA_TEE_PROVER_POLICY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: typescript-e2e
      - run: rustup target add wasm32-unknown-unknown
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      # The e2e suite starts a localnet, whose backend is surfpool.
      - name: Cache surfpool
        id: surfpool-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tools/surfpool
          key: surfpool-${{ runner.os }}-${{ hashFiles('justfile') }}
      - name: Install surfpool
        if: steps.surfpool-cache.outputs.cache-hit != 'true'
        run: just install-surfpool
      - run: npm ci
      - run: just build-photon
      - run: just test-ts-e2e

  escrow-e2e:
    name: typescript / escrow e2e
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 120
    env:
      AGAVE_VERSION: v4.2.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: typescript-escrow
      - name: Install the wasm toolchains
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly-2026-05-18 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: wasm-pack
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - name: Cache surfpool
        id: surfpool-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tools/surfpool
          key: surfpool-${{ runner.os }}-${{ hashFiles('justfile') }}
      - name: Install surfpool
        if: steps.surfpool-cache.outputs.cache-hit != 'true'
        run: just install-surfpool
      - run: npm ci
      - run: just test-escrow-ts

  zk-program-wasm:
    name: typescript / zk program wasm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk-libs/program/tests/wasm/package-lock.json
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: zk-program-wasm
      # Threaded builds need the pinned nightly with rust-src for build-std.
      - name: Install the wasm toolchains
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly-2026-05-18 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: wasm-pack
      # The fixture key writer runs the snarkjs CLI.
      - run: npm install -g snarkjs@0.7.6
      - run: npx --yes playwright@1.63.0 install-deps chromium
      - run: just test-zk-program-wasm
      # A standalone circuit's Node.js wasm package, proved and verified in Node.
      - run: just test-zk-wasm
