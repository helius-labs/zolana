name: typescript

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  SBF_TOOLS_VERSION: v1.54
  NODE_VERSION: "22"

jobs:
  # Job-level path filter, not workflow-level `paths:`. `typescript / merge gate`
  # is about to be the sole required check; a skipped workflow would leave that
  # check unreported and block every unrelated pull request.
  changes:
    name: typescript / changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            typescript:
              - 'sdk-libs/**'
              # Paired SDK examples (TS + Rust). The e2e job runs both; without
              # these globs an example-only edit would skip the only job that
              # exercises them. sdk-libs/** already covers the Rust client the
              # example imports.
              - 'sdk-tests/typescript-client/**'
              - 'sdk-tests/rust-client/**'
              - 'program-libs/**'
              - 'programs/**'
              - 'prover/**'
              - 'services/photon/**'
              - 'xtask/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig.eslint.json'
              - 'eslint.config.js'
              - 'prettier.config.js'
              - 'vitest.config.js'
              - '.github/workflows/typescript.yml'
              - '.github/actions/setup-rust/**'
              - 'justfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'

  build:
    name: typescript / build
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.typescript == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-build
          wasm-target: "true"
      - run: npm ci
      - run: npm run build
      - name: Pack TypeScript build output
        run: tar -czf ts-dist.tar.gz sdk-libs/ts/*/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ts-dist-${{ github.sha }}
          path: ts-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  gate-scope:
    name: typescript / gate scope
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.typescript == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The jobs below split `npm run check` by the services each part needs. A
      # sub-script added to `check` without a job here would leave the merge gate
      # narrower than the script it claims to run. check:scope prints that split
      # and fails when package.json drifts from the documented composition.
      - name: Assert the jobs cover every part of npm run check
        run: npm run check:scope

  static:
    name: typescript / static
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: |
      needs.changes.outputs.typescript == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Rust stays here so a stale @zolana/hasher artifact still fails this job
      # even when dist/ was produced elsewhere.
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-build
          wasm-target: "true"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ts-dist-${{ github.sha }}
      - name: Restore TypeScript build output
        run: tar -xzf ts-dist.tar.gz
      - name: Refuse a stale hasher artifact
        run: node sdk-libs/ts/hasher/scripts/build-hooks.mjs
      - run: npm run check:scope
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:packages
      - run: npm run format:check

  suites:
    name: typescript / suites
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: |
      needs.changes.outputs.typescript == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-build
          wasm-target: "true"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ts-dist-${{ github.sha }}
      - name: Restore TypeScript build output
        run: tar -xzf ts-dist.tar.gz
      - name: Refuse a stale hasher artifact
        run: node sdk-libs/ts/hasher/scripts/build-hooks.mjs
      # Suites shell out to this xtask oracle (groth16-verify). Pre-build it so
      # vitest never pays a cold `cargo run` compile against the 30s default
      # timeout; the helper fails immediately if the binary is missing.
      - name: Pre-build TypeScript suite Rust oracles
        run: cargo build -p xtask --bin groth16-verify
      - run: npm run check:suites

  packaging:
    name: typescript / packaging
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: |
      needs.changes.outputs.typescript == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-build
          wasm-target: "true"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ts-dist-${{ github.sha }}
      - name: Restore TypeScript build output
        run: tar -xzf ts-dist.tar.gz
      - name: Refuse a stale hasher artifact
        run: node sdk-libs/ts/hasher/scripts/build-hooks.mjs
      # Same composition as check:packaging, without a second full rebuild.
      - run: |
          npm run test:inventory
          npm run test:exports
          npm run test:dependencies
          npm run api:check
          node sdk-libs/ts/config/browser-check.mjs
          node sdk-libs/ts/config/pack-check.mjs

  # `test:browser` only greps the bundle. This job runs the cryptographic
  # vectors in headless Chromium so a Node/browser byte divergence fails the
  # merge gate. One engine, cached browser download, vector suite only.
  browser-runtime:
    name: typescript / browser runtime
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: |
      needs.changes.outputs.typescript == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ts-dist-${{ github.sha }}
      - name: Restore TypeScript build output
        run: tar -xzf ts-dist.tar.gz
      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser-runtime

  # Every committed JSON fixture under sdk-libs/ts is produced by an xtask
  # generator with a `--check` mode. This job is the only place CI regenerates
  # those files against HEAD, so a Rust-side change that invalidates a fixture
  # fails here rather than leaving TypeScript tests green on stale data.
  fixtures:
    name: typescript / fixtures
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.typescript == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # ts-fixtures reads frozen baseline blobs out of git history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-fixtures
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: npm ci
      - run: npm run check:fixtures

  e2e:
    name: typescript / e2e
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: |
      needs.changes.outputs.typescript == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 120
    env:
      AGAVE_VERSION: v4.0.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: localnet-photon
          wasm-target: "true"
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install Anza CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # The action lifecycle suite creates its SPL mint through the spl-token
      # binary that ships with the Anza release; fail here rather than mid-suite.
      - name: Check the local stack binaries the suites shell out to
        run: |
          solana-test-validator --version
          spl-token --version
      - name: Install pinned SBF platform tools
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only
      # The prover downloads a missing key from CloudFront and verifies it against
      # the committed lockfile, so the lockfile hash is the correct cache key.
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - name: Cache Squads smart account binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: squads-cache
        with:
          path: target/deploy/squads_smart_account_program.so
          key: squads-smart-account-SMRTzfY6DfH5ik3TKiyLFfXexV8uSG3d2UksSCYdunG
      - name: Fetch Squads smart account binary
        if: steps.squads-cache.outputs.cache-hit != 'true'
        run: just fetch-smart-account
      - run: just build-programs
      - run: just build-prover-server
      # Same-revision Photon at target/debug/photon, which is where the test kit
      # looks when ZOLANA_PHOTON_BIN is unset.
      - run: just build-photon
      # CLI binary for the Rust paired example (LocalnetValidator shells out to
      # it). Incremental after the Photon/program builds; cold cost is one
      # `cargo build -p zolana-cli`.
      - run: just build-cli
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ts-dist-${{ github.sha }}
      - name: Restore TypeScript build output
        run: tar -xzf ts-dist.tar.gz
      # ZOLANA_PORT_OFFSET and the three service URLs stay unset: each suite
      # asserts its own offset (300 for actions, 400 for instructions, 500 for
      # the paired TS example, 800 for the Photon contract suite) and starts the
      # validator, prover, and Photon it needs. A set URL would make the test
      # kit treat that service as external and skip starting it.
      # No log-collection step follows: the test kit keeps the last 8 KB of each
      # service's output in memory and attaches it to the failure it throws.
      - run: npm run check:e2e
      # Rust half of the paired SDK example. Step-scoped env only: must not set
      # job-level ZOLANA_PORT_OFFSET / service URLs (see comment above). Offset
      # 600 avoids 300/400/500/800 used by the TypeScript suites. setup() boots
      # its own validator, Photon, and prover; failure fails the job (and thus
      # merge-gate).
      - name: Run Rust SDK paired example
        env:
          ZOLANA_PORT_OFFSET: "600"
          ZOLANA_LOCALNET_RPC_PORT: "9499"
          ZOLANA_LOCALNET_PHOTON_PORT: "9384"
          ZOLANA_LOCALNET_URL: "http://127.0.0.1:9499"
          ZOLANA_INDEXER_URL: "http://127.0.0.1:9384"
          ZOLANA_PROVER_URL: "http://127.0.0.1:3601"
          ZOLANA_PHOTON_BIN: ${{ github.workspace }}/target/debug/photon
          ZOLANA_CLI_BIN: ${{ github.workspace }}/target/debug/zolana
        run: cargo run -p client-example --example deposit_transfer_withdraw

  merge-gate:
    name: typescript / merge gate
    runs-on: ubuntu-latest
    # Always conclude on non-draft events. Path filtering skips the expensive
    # jobs; this job must still succeed so the required check is satisfiable.
    if:
      always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, build, gate-scope, static, suites, packaging, browser-runtime, fixtures, e2e]
    steps:
      - name: Require the TypeScript tier, or accept a deliberate skip
        run: |
          typescript="${{ needs.changes.outputs.typescript }}"
          changes_result="${{ needs.changes.result }}"
          echo "changes: $changes_result (typescript=$typescript)"
          if [ "$changes_result" != "success" ]; then
            echo "the changes job did not succeed" >&2
            exit 1
          fi
          if [ "$typescript" != "true" ]; then
            echo "no TypeScript-tier paths changed; merge gate is satisfied"
            exit 0
          fi
          for pair in \
            "build:${{ needs.build.result }}" \
            "gate-scope:${{ needs.gate-scope.result }}" \
            "static:${{ needs.static.result }}" \
            "suites:${{ needs.suites.result }}" \
            "packaging:${{ needs.packaging.result }}" \
            "browser-runtime:${{ needs.browser-runtime.result }}" \
            "fixtures:${{ needs.fixtures.result }}" \
            "e2e:${{ needs.e2e.result }}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "the TypeScript merge gate did not pass ($job=$result)" >&2
              exit 1
            fi
          done
