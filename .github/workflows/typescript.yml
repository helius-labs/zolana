name: typescript

on:
  push:
    branches: [main]
    paths-ignore:
      - "protocol-ops/**"
      - ".github/workflows/protocol-ops.yml"
  pull_request:
    paths-ignore:
      - "protocol-ops/**"
      - ".github/workflows/protocol-ops.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  SBF_TOOLS_VERSION: v1.54

jobs:
  changes:
    name: typescript / changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      # Same ignore list as rust.yml. The wasm tests do not import the TS SDK.
      - id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo rust=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ignored='^(.*\.md|LICENSE[^/]*|\.gitignore|prover/server/.*|sdk-libs/ts/.*|sdk-tests/client/typescript/.*|package\.json|package-lock\.json)$'
          if git diff --name-only --no-renames HEAD^1 HEAD | grep -vE "$ignored" > /dev/null; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi

  check:
    name: typescript / check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:ts
      - run: npm run docs:ts
      - name: Verify the published package
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npm pack --workspace @heliuslabs/zolana --pack-destination "$tmp"
          set -- "$tmp"/*.tgz
          test "$#" -eq 1
          tarball="$1"
          printf '{"private":true,"type":"module"}\n' > "$tmp/package.json"
          kit_range="$(node -p "require('./sdk-libs/ts/package.json').peerDependencies['@solana/kit']")"
          npm --prefix "$tmp" install "$tarball" "@solana/kit@$kit_range" --ignore-scripts
          cat > "$tmp/smoke.mts" <<'TS'
          import { createZolanaClient, type ZolanaClientConfig } from "@heliuslabs/zolana";
          const config: ZolanaClientConfig = {
            solanaRpcUrl: new URL("http://127.0.0.1:8899"),
            indexerUrl: undefined,
            proverUrl: undefined,
          };
          await createZolanaClient(config);
          TS
          ./node_modules/.bin/tsc \
            --noEmit --strict --exactOptionalPropertyTypes --skipLibCheck \
            --target es2022 --module nodenext --moduleResolution nodenext \
            "$tmp/smoke.mts"
          (
            cd "$tmp"
            node --input-type=module <<'NODE'
          const sdk = await import("@heliuslabs/zolana");
          const instructions = await import("@heliuslabs/zolana/instructions");
          await Promise.all(
            ["addresses", "client", "interface", "internal", "keypair", "transaction", "wallet"].map(
              (subpath) => import(`@heliuslabs/zolana/${subpath}`),
            ),
          );
          if (!sdk.buildTransferTransaction || !instructions.getDepositInstructionAsync) process.exit(1);
          await sdk.createZolanaClient({
            solanaRpcUrl: "http://127.0.0.1:8899",
          });
          NODE
          )

  e2e:
    name: typescript / e2e
    runs-on: ${{ vars.ZOLANA_CI_RUNNER || 'warp-ubuntu-2404-x64-16x' }}
    timeout-minutes: 120
    env:
      AGAVE_VERSION: v4.2.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: typescript
      - run: rustup target add wasm32-unknown-unknown
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      # The e2e suite starts a localnet, whose backend is surfpool.
      - name: Cache surfpool
        id: surfpool-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tools/surfpool
          key: surfpool-${{ runner.os }}-${{ hashFiles('justfile') }}
      - name: Install surfpool
        if: steps.surfpool-cache.outputs.cache-hit != 'true'
        run: just install-surfpool
      - run: npm ci
      - run: just build-photon
      - run: just test-ts-e2e

  escrow-e2e:
    name: typescript / escrow e2e
    runs-on: ${{ vars.ZOLANA_CI_RUNNER || 'warp-ubuntu-2404-x64-16x' }}
    timeout-minutes: 120
    env:
      AGAVE_VERSION: v4.2.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: typescript
          save-cache: "true"
      - name: Install the wasm toolchains
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly-2026-05-18 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: wasm-pack
      - name: Install Anza CLI
        uses: ./.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install SBF platform tools
        uses: ./.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - name: Cache surfpool
        id: surfpool-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tools/surfpool
          key: surfpool-${{ runner.os }}-${{ hashFiles('justfile') }}
      - name: Install surfpool
        if: steps.surfpool-cache.outputs.cache-hit != 'true'
        run: just install-surfpool
      - run: npm ci
      - run: just test-escrow-ts

  zk-program-wasm:
    name: typescript / zk program wasm
    runs-on: ${{ vars.ZOLANA_CI_RUNNER || 'warp-ubuntu-2404-x64-16x' }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk-libs/program/tests/wasm/package-lock.json
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: typescript
      # Threaded builds need the pinned nightly with rust-src for build-std.
      - name: Install the wasm toolchains
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly-2026-05-18 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: wasm-pack
      # The fixture key writer runs the snarkjs CLI.
      - run: npm install -g snarkjs@0.7.6
      - run: npx --yes playwright@1.63.0 install-deps chromium
      - run: just test-zk-program-wasm
      # A standalone circuit's Node.js wasm package, proved and verified in Node.
      - run: just test-zk-wasm
