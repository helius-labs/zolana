name: typescript

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  SBF_TOOLS_VERSION: v1.54
  NODE_VERSION: "22"

jobs:
  gate-scope:
    name: typescript / gate scope
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The jobs below split `npm run check` by the services each part needs. A
      # sub-script added to `check` without a job here would leave the merge gate
      # narrower than the script it claims to run.
      - name: Assert the jobs cover every part of npm run check
        run: |
          node --input-type=module -e '
          import { readFile } from "node:fs/promises";
          const { scripts } = JSON.parse(await readFile("package.json", "utf8"));
          const jobs = [
            "check:static",
            "check:suites",
            "check:packaging",
            "check:browser-runtime",
            "check:fixtures",
            "check:e2e",
          ];
          const expected = jobs.map((name) => `npm run ${name}`).join(" && ");
          if (scripts.check !== expected) {
            throw new Error(`package.json check runs "${scripts.check}"; this workflow runs "${expected}"`);
          }
          '

  # Deliberately outside `npm run check`, which gates shipped code. This gates the
  # review checklist, needs no install, and runs in seconds, so it stays a job of
  # its own rather than widening the assertion in gate-scope.
  planning:
    name: typescript / planning
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node sdk-libs/ts/config/review-checklist-check.mjs

  static:
    name: typescript / static
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-build
          wasm-target: "true"
      - run: npm ci
      - run: npm run check:static

  suites:
    name: typescript / suites
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-build
          wasm-target: "true"
      - run: npm ci
      - run: npm run build
      - run: npm run check:suites

  packaging:
    name: typescript / packaging
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-build
          wasm-target: "true"
      - run: npm ci
      - run: npm run check:packaging

  # `test:browser` only greps the bundle. This job runs the cryptographic
  # vectors in headless Chromium so a Node/browser byte divergence fails the
  # merge gate. One engine, cached browser download, vector suite only.
  browser-runtime:
    name: typescript / browser runtime
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-build
          wasm-target: "true"
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run check:browser-runtime

  # Every committed JSON fixture under sdk-libs/ts is produced by an xtask
  # generator with a `--check` mode. This job is the only place CI regenerates
  # those files against HEAD, so a Rust-side change that invalidates a fixture
  # fails here rather than leaving TypeScript tests green on stale data.
  fixtures:
    name: typescript / fixtures
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # ts-fixtures reads frozen baseline blobs out of git history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: ./.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: ts-fixtures
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: npm ci
      - run: npm run check:fixtures

  e2e:
    name: typescript / e2e
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 120
    env:
      AGAVE_VERSION: v4.0.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: localnet-photon
          wasm-target: "true"
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install Anza CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # The action lifecycle suite creates its SPL mint through the spl-token
      # binary that ships with the Anza release; fail here rather than mid-suite.
      - name: Check the local stack binaries the suites shell out to
        run: |
          solana-test-validator --version
          spl-token --version
      - name: Install pinned SBF platform tools
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only
      # The prover downloads a missing key from CloudFront and verifies it against
      # the committed lockfile, so the lockfile hash is the correct cache key.
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - name: Cache Squads smart account binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: squads-cache
        with:
          path: target/deploy/squads_smart_account_program.so
          key: squads-smart-account-SMRTzfY6DfH5ik3TKiyLFfXexV8uSG3d2UksSCYdunG
      - name: Fetch Squads smart account binary
        if: steps.squads-cache.outputs.cache-hit != 'true'
        run: just fetch-smart-account
      - run: just build-programs
      - run: just build-prover-server
      # Same-revision Photon at target/debug/photon, which is where the test kit
      # looks when ZOLANA_PHOTON_BIN is unset.
      - run: just build-photon
      - run: npm ci
      - run: npm run build
      # ZOLANA_PORT_OFFSET and the three service URLs stay unset: each suite
      # asserts its own offset (300 for actions, 400 for instructions) and starts
      # the validator, prover, and Photon it needs. A set URL would make the test
      # kit treat that service as external and skip starting it.
      # No log-collection step follows: the test kit keeps the last 8 KB of each
      # service's output in memory and attaches it to the failure it throws.
      - run: npm run check:e2e

  merge-gate:
    name: typescript / merge gate
    runs-on: ubuntu-latest
    if:
      always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      [gate-scope, planning, static, suites, packaging, browser-runtime, fixtures, e2e]
    steps:
      - name: Require every part of npm run check
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "the TypeScript merge gate did not pass" >&2
              exit 1
            fi
          done
