name: protocol-ops

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "protocol-ops/**"
      - "program-libs/**"
      - "prover/server/**"
      - "services/photon/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/protocol-ops.yml"
      - ".github/actions/setup-rust/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "programs/**"
      - "protocol-ops/**"
      - "program-libs/**"
      - "prover/server/**"
      - "services/photon/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/protocol-ops.yml"
      - ".github/actions/setup-rust/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  unit:
    name: protocol-ops / compile + test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Check Rust formatting
        run: cargo fmt -p forester -p zolana-forester-prover -p zolana-protocol-cli -p zolana-protocol-instructions -p zolana-smart-account-client -p zolana-merkle-tree -- --check
      - run: go test ./...
        working-directory: protocol-ops/forester-prover/go
      - name: Check protocol crates
        run: cargo clippy -p forester -p zolana-forester-prover -p zolana-protocol-cli -p zolana-protocol-instructions -p zolana-smart-account-client -p zolana-merkle-tree --all-targets -- -D warnings
      - name: Check remote-only proving
        run: cargo check -p forester -p zolana-forester-prover --no-default-features --all-targets
      - run: cargo test -p forester -p zolana-forester-prover -p zolana-protocol-cli -p zolana-protocol-instructions -p zolana-smart-account-client -p zolana-merkle-tree
