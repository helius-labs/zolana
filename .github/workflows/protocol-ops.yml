name: protocol-ops

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "protocol-ops/**"
      - "program-libs/**"
      - "prover/server/**"
      - "services/photon/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/protocol-ops.yml"
      - ".github/actions/setup-rust/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "programs/**"
      - "protocol-ops/**"
      - "program-libs/**"
      - "prover/server/**"
      - "services/photon/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/protocol-ops.yml"
      - ".github/actions/setup-rust/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  unit:
    name: protocol-ops / compile + test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Check Rust formatting
        run: cargo fmt -p forester -p spr-forester-prover -p spr-protocol-cli -p spr-protocol-instructions -p spr-smart-account-client -p spr-merkle-tree -- --check
      - run: go test ./...
        working-directory: protocol-ops/forester-prover/go
      - name: Check protocol crates
        run: cargo clippy -p forester -p spr-forester-prover -p spr-protocol-cli -p spr-protocol-instructions -p spr-smart-account-client -p spr-merkle-tree --all-targets -- -D warnings
      - name: Check remote-only proving
        run: cargo check -p forester -p spr-forester-prover --no-default-features --all-targets
      - name: Check dependency boundaries
        run: just check-deps
      - name: Compile consumers of shared protocol libraries
        run: |
          cargo check --all-targets \
            -p spr-cli -p spr-client -p spr-program-test -p spr-test-utils \
            -p shielded-pool-tests -p spp-test-validator -p ring-test-program -p tree-bench \
            -p client-example -p dynamic-swap-test -p rfq-test -p swap-test-validator -p xtask \
            --features spr-client/proofs,spr-test-utils/parallel,shielded-pool-tests/localnet,shielded-pool-tests/proofs
      - run: cargo test -p forester -p spr-forester-prover -p spr-protocol-cli -p spr-protocol-instructions -p spr-smart-account-client -p spr-merkle-tree
      - name: Test the program tree against the reference implementation
        run: just test-tree

  proofs:
    name: protocol-ops / local + Redis proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    services:
      redis:
        image: redis:7.4.4-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      FORESTER_TEST_KEYS_DIR: ${{ github.workspace }}/target/forester-proving-keys
      FORESTER_TEST_PROVER_BIN: ${{ github.workspace }}/target/prover-server
      FORESTER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Cache the pinned 40x10 proving key
        uses: actions/cache@v4
        with:
          path: target/forester-proving-keys/batch_address-append_40_10.key
          key: forester-40x10-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - run: just build-prover-server
      - name: Download and verify the pinned 40x10 key
        run: target/prover-server download --run-mode forester-test --keys-dir "$FORESTER_TEST_KEYS_DIR" --max-retries 3
      - name: Prove locally through the Forester client
        run: cargo test -p spr-forester-prover --test local_batch_proof -- --ignored
      - name: Prove through Redis using the remote-only Forester client
        run: cargo test -p spr-forester-prover --no-default-features --test remote_batch_proof -- --ignored
