name: xtask

# The verifying-key smoke runs the xtask codegen against the Go prover server's
# export-vk, so xtask and the prover are its inputs.
on:
  push:
    branches: [main]
    paths:
      - "xtask/**"
      - "prover/**"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/xtask-verifying-keys.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "xtask/**"
      - "prover/**"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/xtask-verifying-keys.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  xtask-verifying-keys:
    name: xtask / verifying-keys smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      # The xtask exports the verifying key by running the Go prover server.
      - uses: actions/setup-go@v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Cache the smoke proving key
        uses: actions/cache@v4
        with:
          path: target/verifying-keys-smoke/keys
          key: verifying-keys-smoke-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - run: just xtask-create-verifying-keys-smoke
