name: DvP Photon migration probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch verified test Photon
        run: |
          curl -sSfL --retry 5 https://github.com/helius-labs/zolana/releases/download/test-dvp-pr-41-20261017-48dd150/photon-linux-x64-test-dvp-pr-41-20261017-48dd150 -o /tmp/photon
          echo '9cf15bfded5bde72649b5b13d0fc74513da622e248b0c8dd0bba67283c7da052  /tmp/photon' | sha256sum --check
          chmod +x /tmp/photon
      - name: Probe isolated temporary database migrations
        run: |
          python3 - <<'PYTHON'
          import json, os, signal, subprocess, tempfile
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          def attempt(index, connections):
            with tempfile.TemporaryDirectory(prefix='photon-migration-') as directory:
              process=subprocess.Popen(['/tmp/photon','--disable-api','--disable-indexing','--max-db-conn',str(connections)],env=dict(os.environ,TMPDIR=directory),stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              lines=[]
              for line in process.stdout:
                lines.append(line)
                if 'Starting API server' in line:
                  process.send_signal(signal.SIGINT)
                  process.wait(timeout=10)
                  return None
              process.wait(timeout=10)
              return ''.join(lines)
          results={}
          for connections in (10,1):
            with ThreadPoolExecutor(max_workers=8) as pool:
              failures=[output for output in pool.map(lambda index:attempt(index,connections),range(100)) if output is not None]
            results[str(connections)]=failures
            print(f'connections={connections}: {len(failures)} failures out of100')
            if failures: print(failures[0])
          Path('/tmp/migration-probe.json').write_text(json.dumps(results,indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: photon-migration-probe
          path: /tmp/migration-probe.json
