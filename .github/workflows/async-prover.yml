name: async prover

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
      - "sdk-libs/ts/**"
      - "sdk-tests/client/typescript/**"
      - "package.json"
      - "package-lock.json"
  # No paths-ignore here: "async prover / transfer queue" is a required check,
  # and a workflow that never triggers leaves it "Expected" forever. The
  # changes job applies the same ignore list, so a skipped job still reports.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: async prover / changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ignored='^(.*\.md|LICENSE[^/]*|\.gitignore|sdk-libs/ts/.*|sdk-tests/client/typescript/.*|package\.json|package-lock\.json)$'
          if git diff --name-only --no-renames HEAD^1 HEAD | grep -vE "$ignored" > /dev/null; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  transfer-queue:
    name: async prover / transfer queue
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.4-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      ZOLANA_PROVER_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: async-prover
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Cache proving keys
        uses: actions/cache@v4
        with:
          path: prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/server/prover/provingkeys/proving-keys.lock') }}
      - run: just test-client-async-transfer-queue
      - name: Dump prover log on failure
        if: failure()
        run: |
          find . -name prover-server.log -exec sh -c 'echo "--- {} ---"; tail -200 "{}"' \; 2>/dev/null \
            || echo "(no prover log)"
