name: publish-gpu

on:
  push:
    branches: [main]
    paths:
      - "prover/server/**"
      - "services/photon/**"
      - "program-libs/**"
      - "sdk-libs/indexer-api/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "tools/gpu/**"
      - "tools/check-photon-image.sh"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES"
      - ".github/workflows/publish-gpu.yml"
  workflow_dispatch:

concurrency:
  group: publish-gpu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  REGISTRY: 558215002830.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: image-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # No cache, builder layers hold Aeglos build output.
          - service: prover
            cuda-arch: sm_89
            context: prover/server
            dockerfile: prover/server/Dockerfile.aeglos
          - service: photon
            context: .
            dockerfile: services/photon/Dockerfile
            cache-from: type=gha,scope=gpu-photon
            cache-to: type=gha,mode=max,scope=gpu-photon
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: gpu-${{ matrix.service }}-publish
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
      - name: Resolve immutable image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          CUDA_ARCH: ${{ matrix.cuda-arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix=gpu
          [[ "$GITHUB_REF" == refs/heads/main ]] || prefix=gpu-preview
          [[ -z "$CUDA_ARCH" ]] || prefix+="-${CUDA_ARCH/_/}"
          tag="$prefix-$GITHUB_SHA"
          echo "tag=$REGISTRY/zolana-$SERVICE:$tag" >> "$GITHUB_OUTPUT"
          if result=$(aws ecr describe-images --repository-name "zolana-$SERVICE" --image-ids "imageTag=$tag" 2>&1); then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            digest=$(tools/gpu/ecr-digest.sh "zolana-$SERVICE" "$tag")
            if ! gh attestation verify "oci://$REGISTRY/zolana-$SERVICE@$digest" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-gpu.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"; then
              echo "::error::Verification failed for zolana-$SERVICE:$tag. If it has no attestation from this ref and commit, delete the tag and rerun." >&2
              exit 1
            fi
          elif [[ "$result" == *ImageNotFoundException* ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo "$result" >&2
            exit 1
          fi
      - name: Fetch pinned Aeglos source
        id: aeglos
        if: matrix.service == 'prover' && steps.image.outputs.exists == 'false'
        env:
          AEGLOS_READ_TOKEN: ${{ secrets.PRIVATE_LIBS_TOKEN }}
        run: |
          test -n "$AEGLOS_READ_TOKEN"
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$AEGLOS_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" tools/gpu/fetch-aeglos.sh "$RUNNER_TEMP/aeglos-source"
          {
            echo 'contexts<<EOF'
            echo "aeglos_source=$RUNNER_TEMP/aeglos-source"
            echo "repository=$GITHUB_WORKSPACE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.image.outputs.exists == 'false'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: steps.image.outputs.exists == 'false'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-contexts: ${{ steps.aeglos.outputs.contexts }}
          build-args: ${{ matrix.cuda-arch && format('CUDA_ARCH={0}', matrix.cuda-arch) || '' }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ matrix.cache-to }}
      - name: Check and publish
        id: publish
        if: steps.image.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          SERVICE: ${{ matrix.service }}
        run: |
          if [[ "$SERVICE" == prover ]]; then
            docker run --rm "$IMAGE" --help >/dev/null
            test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = 65532
          else
            tools/check-photon-image.sh "$IMAGE"
          fi
          docker push "$IMAGE"
          digest=$(tools/gpu/ecr-digest.sh "zolana-$SERVICE" "${IMAGE##*:}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: steps.image.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/zolana-${{ matrix.service }}
          subject-digest: ${{ steps.publish.outputs.digest }}
