name: publish-gpu

on:
  push:
    branches: [main]
    paths:
      - "prover/server/**"
      - "services/photon/**"
      - "program-libs/**"
      - "sdk-libs/indexer-api/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "tools/gpu/**"
      - ".github/workflows/publish-gpu.yml"
  workflow_dispatch:

concurrency:
  group: publish-gpu
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  REGISTRY: 558215002830.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: image-publish
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: prover
            prefix: gpu-sm89
            context: prover/server
            dockerfile: prover/server/Dockerfile.aeglos
          - service: photon
            prefix: gpu
            context: .
            dockerfile: services/photon/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: gpu-${{ matrix.service }}-publish
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
      - name: Resolve immutable image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          tag="$PREFIX-$GITHUB_SHA"
          echo "tag=$REGISTRY/zolana-$SERVICE:$tag" >> "$GITHUB_OUTPUT"
          if result=$(aws ecr describe-images --repository-name "zolana-$SERVICE" --image-ids "imageTag=$tag" 2>&1); then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ "$result" == *ImageNotFoundException* ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo "$result" >&2
            exit 1
          fi
      - name: Fetch pinned Aeglos source
        if: matrix.service == 'prover' && steps.image.outputs.exists == 'false'
        env:
          AEGLOS_READ_TOKEN: ${{ secrets.PRIVATE_LIBS_TOKEN }}
        run: |
          test -n "$AEGLOS_READ_TOKEN"
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$AEGLOS_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" tools/gpu/fetch-aeglos.sh "$RUNNER_TEMP/aeglos-source"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.image.outputs.exists == 'false'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: steps.image.outputs.exists == 'false'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-contexts: ${{ matrix.service == 'prover' && format('aeglos_source={0}/aeglos-source', runner.temp) || '' }}
          build-args: CUDA_ARCH=sm_89
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gpu-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=gpu-${{ matrix.service }}
      - name: Check and publish
        if: steps.image.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          SERVICE: ${{ matrix.service }}
        run: |
          if [[ "$SERVICE" == prover ]]; then
            docker run --rm "$IMAGE" --help
          else
            docker run --rm "$IMAGE" photon --version
            docker run --rm "$IMAGE" photon-migration --version
          fi
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != 0
          docker push "$IMAGE"
