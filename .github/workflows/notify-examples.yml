name: notify-examples

on:
  push:
    branches: [main]
    paths:
      - "sdk-libs/ts/**"
      - "sdk-libs/client/**"
      - "sdk-libs/keypair/**"
      - "sdk-libs/transaction/**"
      - "program-libs/interface/**"
  workflow_dispatch:
    inputs:
      sha:
        description: zolana SHA to sync (blank uses github.sha)
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve SHA
        id: ref
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$PUSH_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "html_url=${{ github.server_url }}/helius-labs/zolana/commit/$sha" >> "$GITHUB_OUTPUT"

      # Setup: ../README.md. Scope the token to the receiving repository.
      - name: Create dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.EXAMPLES_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.EXAMPLES_DISPATCH_APP_PRIVATE_KEY }}
          owner: helius-labs
          repositories: zolana-examples
          permission-contents: write

      - uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: helius-labs/zolana-examples
          event-type: sdk-changed
          client-payload: |
            {
              "sha": "${{ steps.ref.outputs.sha }}",
              "html_url": "${{ steps.ref.outputs.html_url }}"
            }
