name: gpu-deploy-scripts

# Program changes run the full validation suite, including these script checks.
on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "tools/gpu/**"
      - "tools/nitro/**"
      - "tools/check-photon-image.sh"
      - "prover/server/build-aeglos.sh"
      - "prover/server/Dockerfile.aeglos"
      - "prover/server/prover/backend/aeglos-source.lock"
      - "prover/server/nitro/**"
      - "prover/server/Dockerfile.nitro"
      - "prover/server/Dockerfile.light"
      - "tools/images/**"
      - "justfile"
      - "prover/server/app/app.go"
      - "prover/server/release-build.env"
      - "prover/server/release-settings.sh"
      - "prover/server/prover/common/key_downloader.go"
      - "prover/server/prover/provingkeys/proving-keys.lock"
      - ".github/workflows/publish-gpu.yml"
      - ".github/workflows/gpu-deploy-scripts.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "programs/**"
      - "tools/gpu/**"
      - "tools/nitro/**"
      - "tools/check-photon-image.sh"
      - "prover/server/build-aeglos.sh"
      - "prover/server/Dockerfile.aeglos"
      - "prover/server/prover/backend/aeglos-source.lock"
      - "prover/server/nitro/**"
      - "prover/server/Dockerfile.nitro"
      - "prover/server/Dockerfile.light"
      - "tools/images/**"
      - "justfile"
      - "prover/server/app/app.go"
      - "prover/server/release-build.env"
      - "prover/server/release-settings.sh"
      - "prover/server/prover/common/key_downloader.go"
      - "prover/server/prover/provingkeys/proving-keys.lock"
      - ".github/workflows/publish-gpu.yml"
      - ".github/workflows/gpu-deploy-scripts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-deploy-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck tools/gpu/*.sh tools/check-photon-image.sh prover/server/build-aeglos.sh prover/server/release-settings.sh prover/server/nitro/*.sh
      - run: python3 -m unittest discover -s tools/gpu -p 'test_*.py'
        env:
          GPU_GATEWAY_TEST: '1'
      - run: python3 -m unittest discover -s tools/nitro -p 'test_*.py'
        env:
          NITRO_GATEWAY_TEST: '1'
      - run: python3 -m unittest discover -s tools/images -p 'test_*.py'
