name: forester

on:
  push:
    branches: [main]
    paths:
      - "protocol/**"
      - "program-libs/**"
      - "prover/server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/forester.yml"
      - ".github/actions/setup-rust/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "protocol/**"
      - "program-libs/**"
      - "prover/server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/forester.yml"
      - ".github/actions/setup-rust/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  unit:
    name: forester / compile + test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: go test ./...
        working-directory: protocol/forester-prover/go
      - run: cargo check -p forester -p zolana-protocol-cli --all-targets
      - run: cargo test -p forester -p zolana-forester-prover -p zolana-protocol-cli -p zolana-protocol-instructions -p zolana-protocol-transaction -p zolana-smart-account-client -p zolana-merkle-tree
