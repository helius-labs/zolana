name: formal-verification

on:
  push:
    branches: [main]
    paths:
      - "prover/server/**"
      - ".github/workflows/formal-verification.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "prover/server/**"
      - ".github/workflows/formal-verification.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-verification:
    name: formal-verification / lean
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # A clean VerifiableEncryption build with two Lean processes took 49 min
    # locally; a 4-core runner is estimated at 75-110 min on top of the
    # existing steps.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: prover/server/go.mod
          cache-dependency-path: prover/server/go.sum

      - name: Build light-prover
        run: cd prover/server && go build -o light-prover .

      # The committed Circuit.lean must match the extraction of the current
      # circuits; the Lean proofs are stated against these definitions, so
      # silent drift would verify stale circuits.
      - name: Extract circuits and check for drift
        run: |
          cd prover/server
          ./light-prover extract-circuit --output formal-verification/FormalVerification/Circuit.lean --state-tree-height 32 --nullifier-tree-height 40 --batch-size 8
          git diff --exit-code formal-verification/FormalVerification/Circuit.lean

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every generated module of the VerifiableEncryption library: the
      # circuit extraction, the Go tables, certificates and instance modules,
      # the Python proof generators that walk the extraction, and the library
      # root. Mirrors `just regen-ve-formal`; the committed files must match.
      - name: Regenerate verifiable-encryption modules and check for drift
        run: |
          cd prover/server
          ./light-prover extract-ve-circuit --output-dir formal-verification
          ./light-prover extract-ve-tables --output-dir formal-verification
          cd formal-verification
          python3 scripts/gen_field_bytes.py
          python3 scripts/gen_envelope_bodies.py
          python3 scripts/gen_aes_key_expansion.py VerifiableEncryption/Aes/KeyExpansion.lean
          python3 scripts/gen_aes_ctr_block.py VerifiableEncryption/Aes/CtrBlock.lean
          python3 scripts/gen_aes_envelope.py VerifiableEncryption/Aes/EnvelopeAes.lean
          python3 scripts/gen_comb_limbs.py
          python3 scripts/gen_ve_root.py
          git diff --exit-code VerifiableEncryption/ VerifiableEncryption.lean
          test -z "$(git status --porcelain VerifiableEncryption/ VerifiableEncryption.lean)"

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean dependencies
        uses: actions/cache@v4
        with:
          path: prover/server/formal-verification/.lake
          key: lean-${{ hashFiles('prover/server/formal-verification/lean-toolchain') }}-${{ hashFiles('prover/server/formal-verification/lake-manifest.json') }}
          restore-keys: |
            lean-${{ hashFiles('prover/server/formal-verification/lean-toolchain') }}-

      - name: Build Lean project (checks all theorems)
        run: |
          cd prover/server/formal-verification
          lake exe cache get || true
          lake build

      # Single VerifiableEncryption modules peak at about 8.5 GB (AxiomsCurve),
      # so at most two Lean processes run at once on the 16 GB runner.
      - name: Build VerifiableEncryption (checks all theorems)
        run: |
          cd prover/server/formal-verification
          LEAN_NUM_THREADS=2 lake build VerifiableEncryption
