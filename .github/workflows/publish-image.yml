name: publish-image

on:
  push:
    branches: [main]
    tags: ["photon-zolana-*"]
    paths:
      - "services/photon/**"
      - "forester/**"
      - "prover/server/**"
      - "program-libs/**"
      - "sdk-libs/event/**"
      - "sdk-libs/indexer-api/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/images.json"
      - "tools/check-photon-image.sh"
      - "tools/release-changes.py"
      - ".github/workflows/publish-*.yml"
  workflow_dispatch:
    inputs:
      service:
        description: Service to publish
        type: choice
        options: [photon, forester, prover]
        default: photon
      channel:
        description: Release opens the devnet-d deployment PR
        type: choice
        options: [release, preview]
        default: release

concurrency:
  group: publish-image-${{ github.ref }}-${{ inputs.service || 'auto' }}
  queue: max

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      short_sha: ${{ steps.changes.outputs.short_sha }}
      services: ${{ steps.changes.outputs.services }}
      nitro: ${{ steps.changes.outputs.nitro }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SERVICE: ${{ inputs.service }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            services="$(jq -nc --arg s "$SERVICE" '[$s]')"
            nitro=false
            if [[ "$SERVICE" == prover && "$CHANNEL" == release ]]; then nitro=true; fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            services='["photon"]'
            nitro=false
          else
            changes="$(python3 tools/release-changes.py "$BEFORE" "$GITHUB_SHA")"
            services="$(jq -c .services <<< "$changes")"
            nitro="$(jq -r .nitro <<< "$changes")"
          fi
          {
            echo "short_sha=${GITHUB_SHA:0:12}"
            echo "services=$services"
            echo "nitro=$nitro"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-service-image.yml
    secrets: inherit
    with:
      service: ${{ matrix.service }}
      channel: ${{ inputs.channel || 'release' }}
      image_tag: ${{ format('{0}-{1}-{2}', matrix.service, inputs.channel == 'preview' && 'preview' || 'zolana', needs.changes.outputs.short_sha) }}

  nitro:
    needs: [changes, publish]
    if: needs.changes.outputs.nitro == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: helius-labs
          repositories: zolana-infra
      - name: Prepare Nitro release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -n --arg source_commit "$SOURCE_COMMIT" --arg run_id "$RUN_ID" \
            '{event_type:"prepare-nitro-release", client_payload:{source_commit:$source_commit, run_id:$run_id}}' \
            | gh api repos/helius-labs/zolana-infra/dispatches --input -
