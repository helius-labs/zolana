[package]
name = "zolana-ring-rpc"
version = "0.1.0"
description = "Custom ring audit RPC service."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/helius-labs/zolana"
publish = false

[[bin]]
name = "ring-rpc"
path = "src/main.rs"

[dependencies]
bytemuck = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hyper = { workspace = true }
jsonrpsee = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
p256 = { workspace = true }
psl = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-address = { workspace = true }
solana-account = { workspace = true }
solana-account-decoder-client-types = { workspace = true, features = ["agave-unstable-api"] }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-commitment-config = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-signature = { workspace = true, features = ["verify"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal", "sync", "time"] }
tower = { workspace = true, features = ["timeout"] }
tower-http = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
zolana-api = { workspace = true }
zolana-client = { workspace = true, features = ["indexer-api", "solana-rpc"] }
zolana-indexer-api = { workspace = true }
zolana-interface = { workspace = true }
zolana-keypair = { workspace = true }
zolana-ring-client = { workspace = true }
zolana-transaction = { workspace = true }
