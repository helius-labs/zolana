                params:
                  type: object
                  required:
                  - owners
                  properties:
                    owners:
                      type: array
                      items:
                        $ref: '#/components/schemas/SerializablePubkey'
                      description: Solana pubkeys to look up in the user registry. At most 100.
                      maxItems: 100
                      minItems: 1
                  additionalProperties: false
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - jsonrpc
