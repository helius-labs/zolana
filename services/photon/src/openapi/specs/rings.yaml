components:
  schemas:
    Base64String:
      type: string
      description: A base64-encoded byte string on the JSON wire.
    Context:
      type: object
      required:
      - blockTime
      - slot
      properties:
        blockTime:
          type: integer
          format: int64
        slot:
          type: integer
          format: u-int64
          description: Highest slot the indexer has persisted, for slot-based freshness checks.
          minimum: 0
    Cursor:
      type: string
    EncryptedUtxoMatch:
      type: object
      required:
      - slot
      - txSignature
      - outputSlot
      properties:
        outputSlot:
          $ref: '#/components/schemas/RingsOutputSlot'
        salt:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Base64String'
            description: Transaction-level AES salt shared by every output ciphertext.
        slot:
          type: integer
          format: u-int64
          minimum: 0
        txSignature:
          $ref: '#/components/schemas/SerializableSignature'
        txViewingPk:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Base64String'
    Hash:
      type: string
      description: A 32-byte hash represented as a base58 string.
    IndexedShieldedTransaction:
      type: object
      required:
      - eventIndex
      - transaction
      properties:
        eventIndex:
          type: integer
          format: u-int16
          minimum: 0
        transaction:
          $ref: '#/components/schemas/ShieldedTransaction'
    Limit:
      type: integer
      format: u-int64
      maximum: 1000
      minimum: 1
    MerkleContext:
      type: object
      required:
      - treeType
      - tree
      properties:
        tree:
          $ref: '#/components/schemas/SerializablePubkey'
        treeType:
          type: integer
          format: u-int16
          minimum: 0
      additionalProperties: false
    MerkleProof:
      type: object
      required:
      - leaf
      - merkleContext
      - path
      - leafIndex
      - root
      - rootSeq
      - rootIndex
      properties:
        leaf:
          $ref: '#/components/schemas/Hash'
        leafIndex:
          type: integer
          format: u-int64
          minimum: 0
        merkleContext:
          $ref: '#/components/schemas/MerkleContext'
        path:
          type: array
          items:
            $ref: '#/components/schemas/Hash'
        root:
          $ref: '#/components/schemas/Hash'
        rootIndex:
          type: integer
          format: u-int16
          description: |-
            Actual on-chain history position for `root`. A state root's position is
            not derivable from `root_seq`: slots without updates consume no entry.
          minimum: 0
        rootSeq:
          type: integer
          format: u-int64
          description: |-
            Root ordering key: the completed Solana slot for state-tree proof
            freshness, or the on-chain update sequence for an indexed-tree proof.
          minimum: 0
      additionalProperties: false
    NonInclusionProof:
      type: object
      required:
      - leaf
      - merkleContext
      - path
      - lowElement
      - lowElementIndex
      - highElement
      - highElementIndex
      - root
      - rootSeq
      - rootIndex
      properties:
        highElement:
          $ref: '#/components/schemas/Hash'
        highElementIndex:
          type: integer
          format: u-int64
          minimum: 0
        leaf:
          $ref: '#/components/schemas/Hash'
        lowElement:
          $ref: '#/components/schemas/Hash'
        lowElementIndex:
          type: integer
          format: u-int64
          minimum: 0
        merkleContext:
          $ref: '#/components/schemas/MerkleContext'
        path:
          type: array
          items:
            $ref: '#/components/schemas/Hash'
        root:
          $ref: '#/components/schemas/Hash'
        rootIndex:
          type: integer
          format: u-int16
          description: On-chain history position for `root`.
          minimum: 0
        rootSeq:
          type: integer
          format: u-int64
          description: |-
            Root ordering key: the completed Solana slot for a state-tree proof,
            or the on-chain update sequence for an indexed-tree proof.
          minimum: 0
      additionalProperties: false
    NullifierQueueElement:
      type: object
      description: One queued nullifier, in on-chain input-queue order.
      required:
      - seq
      - value
      properties:
        seq:
          type: integer
          format: u-int64
          minimum: 0
        value:
          $ref: '#/components/schemas/Hash'
      additionalProperties: false
    RingsMessage:
      type: object
      required:
      - viewTag
      - payload
      properties:
        payload:
          $ref: '#/components/schemas/Base64String'
        viewTag:
          $ref: '#/components/schemas/Hash'
    RingsOutputContext:
      type: object
      required:
      - hash
      - tree
      - treeId
      - leafIndex
      properties:
        hash:
          $ref: '#/components/schemas/Hash'
        leafIndex:
          type: integer
          format: u-int64
          minimum: 0
        tree:
          $ref: '#/components/schemas/SerializablePubkey'
          description: |-
            The tree account the output was appended to.

            Deprecated: it is `pda::tree(tree_id)` and carries nothing `tree_id`
            does not. Emitted for one release so readers can move over, then
            dropped.
        treeId:
          type: integer
          format: u-int16
          description: The raw tree id the output's commitment is hashed under.
          minimum: 0
    RingsOutputSlot:
      type: object
      required:
      - viewTag
      - outputContext
      - payload
      properties:
        outputContext:
          $ref: '#/components/schemas/RingsOutputContext'
        payload:
          $ref: '#/components/schemas/Base64String'
        viewTag:
          $ref: '#/components/schemas/Hash'
    SerializablePubkey:
      type: string
      description: A Solana public key represented as a base58 string.
    SerializableSignature:
      type: string
      description: A Solana transaction signature represented as a base58 string.
    ShieldedTransaction:
      type: object
      required:
      - slot
      - txSignature
      - outputSlots
      - messages
      - nullifiers
      - proofless
      properties:
        eventIndex:
          type:
          - integer
          - 'null'
          format: u-int16
          minimum: 0
        messages:
          type: array
          items:
            $ref: '#/components/schemas/RingsMessage'
          description: Published data slots bound to no output commitment, republished verbatim.
        nullifiers:
          type: array
          items:
            $ref: '#/components/schemas/Hash'
        outputSlots:
          type: array
          items:
            $ref: '#/components/schemas/RingsOutputSlot'
        proofless:
          type: boolean
          description: True when at least one output in this transaction is proofless.
        ringConfig:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SerializablePubkey'
            description: |-
              The ring's config account (its `ring_auth` PDA), or `None` when no ring
              authorized this transaction. Observed directly on the transaction, so it
              is always present for a ring.
        ringProgramId:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SerializablePubkey'
            description: |-
              The ring's program, resolved through the indexed registrations. `None`
              when `ringConfig` is `None`, and also when the registration itself was
              never indexed -- so `ringConfig` is what distinguishes "no ring" from
              "ring whose program is unknown here".
        salt:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Base64String'
            description: Transaction-level AES salt shared by every output ciphertext.
        slot:
          type: integer
          format: u-int64
          minimum: 0
        txSignature:
          $ref: '#/components/schemas/SerializableSignature'
        txViewingPk:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Base64String'
    UserRecord:
      type: object
      description: A user registry record, the shielded address a Solana pubkey publishes.
      required:
      - owner
      - nullifierPubkey
      - viewingPubkey
      - mergeEncryption
      properties:
        mergeEncryption:
          type: integer
          format: u-int8
          description: |-
            Merge output encryption scheme the owner accepts for `merge_transact`:
            0 disables merging, 1 is PoseidonCtrV1. While a scheme is selected, any
            caller may merge this owner's UTXOs under that scheme.
          minimum: 0
        nullifierPubkey:
          $ref: '#/components/schemas/Hash'
          description: Wallet-wide nullifier pubkey. Never rotates.
        owner:
          $ref: '#/components/schemas/SerializablePubkey'
        viewingPubkey:
          $ref: '#/components/schemas/Base64String'
          description: Tagged X25519 viewing pubkey (0x04 followed by a canonical 32-byte u-coordinate).
      additionalProperties: false
