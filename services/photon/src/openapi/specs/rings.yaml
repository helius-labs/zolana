openapi: 3.1.0
info:
  title: photon-indexer
  description: Solana indexer for Rings
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.51.2
servers:
- url: https://devnet.helius-rpc.com?api-key=<api_key>
paths:
  /getEncryptedUtxosByTags:
    summary: getEncryptedUtxosByTags
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                id:
                  type: string
                  description: An ID to identify the request.
                  enum:
                  - test-account
                jsonrpc:
                  type: string
                  description: The version of the JSON-RPC protocol.
                  enum:
                  - '2.0'
                method:
                  type: string
                  description: The name of the method to invoke.
                  enum:
                  - getEncryptedUtxosByTags
                params:
                  type: object
                  required:
                  - tags
                  properties:
                    after:
                      oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/Cursor'
                        description: |-
                          Resume strictly after the given transaction. Keep a separate checkpoint
                          for each stream and filter set; new filters must start from their beginning.
                    limit:
                      oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/Limit'
                    minContextSlot:
                      type:
                      - integer
                      - 'null'
                      format: u-int64
                      minimum: 0
                    ringProgramId:
                      oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/SerializablePubkey'
                        description: |-
                          Restrict the match to one ring. Its config account is derived from this
                          program id, so the filter needs no indexed registration.
                    tags:
                      type: array
                      items:
                        $ref: '#/components/schemas/Hash'
                      description: Empty tags require a ring and select its full history.
                  additionalProperties: false
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - jsonrpc
                - id
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    type: string
                    description: An ID to identify the response.
                    enum:
                    - test-account
                  jsonrpc:
                    type: string
                    description: The version of the JSON-RPC protocol.
                    enum:
                    - '2.0'
                  result:
                    type: object
                    description: One bounded page. A terminal cursor is also returned when no item matched.
                    required:
                    - context
                    - items
                    - cursor
                    - hasMore
                    properties:
                      context:
                        $ref: '#/components/schemas/Context'
                      cursor:
                        oneOf:
                        - type: 'null'
                        - $ref: '#/components/schemas/Cursor'
                      hasMore:
                        type: boolean
                      items:
                        type: array
                        items:
                          type: object
                          description: All matching outputs of one Solana transaction.
                          required:
                          - slot
                          - signature
                          - outputs
                          properties:
                            outputs:
                              type: array
                              items:
                                $ref: '#/components/schemas/EncryptedUtxoMatch'
                            signature:
                              $ref: '#/components/schemas/SerializableSignature'
                            slot:
                              type: integer
                              format: u-int64
                              minimum: 0
                          additionalProperties: false
                      outputTreeId:
                        type:
                        - integer
                        - 'null'
                        format: u-int16
                        minimum: 0
        '429':
          description: Exceeded rate limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    type: string
                  jsonrpc:
                    type: string
        '500':
          description: The server encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    type: string
                  jsonrpc:
                    type: string
