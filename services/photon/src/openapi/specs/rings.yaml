openapi: 3.1.0
info:
  title: photon-indexer
  description: Solana indexer for Rings
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.51.2
servers:
- url: https://devnet.helius-rpc.com?api-key=<api_key>
paths:
  /getEncryptedUtxosByTags:
    summary: getEncryptedUtxosByTags
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                id:
                  type: string
                  description: An ID to identify the request.
                  enum:
                  - test-account
                jsonrpc:
                  type: string
                  description: The version of the JSON-RPC protocol.
                  enum:
                  - '2.0'
                method:
                  type: string
                  description: The name of the method to invoke.
                  enum:
                  - getEncryptedUtxosByTags
                params:
                  type: object
                  required:
                  - tags
                  properties:
                    cursor:
                      oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/Base64String'
                    limit:
                      oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/Limit'
                    tags:
                      type: array
                      items:
                        $ref: '#/components/schemas/Hash'
                  additionalProperties: false
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - jsonrpc
                - id
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    type: string
                    description: An ID to identify the response.
                    enum:
                    - test-account
                  jsonrpc:
                    type: string
                    description: The version of the JSON-RPC protocol.
                    enum:
                    - '2.0'
                  result:
                    type: object
                    required:
                    - context
                    - matches
                    properties:
                      context:
                        $ref: '#/components/schemas/Context'
                      matches:
                        type: array
                        items:
                          $ref: '#/components/schemas/EncryptedUtxoMatch'
                        description: Output-level matches; every returned output slot has a view tag from the request.
                      nextCursor:
                        oneOf:
                        - type: 'null'
                        - $ref: '#/components/schemas/Base64String'
                      scannedThrough:
                        oneOf:
                        - type: 'null'
                        - $ref: '#/components/schemas/Base64String'
                          description: |-
                            Where the scan reached, when it ran out of rows rather than filling a
                            page.

                            Separates the two jobs `next_cursor` used to do at once. A cursor on
                            every non-empty page made "is there more?" cost an extra request, and
                            dropping it there instead would leave a caller with no watermark to
                            resume from -- so the watermark moved here, and `next_cursor` now means
                            only that another page exists. Present only on a page the limit did not
                            truncate, which is when "nothing further exists at or before this
                            position" holds.
                    additionalProperties: false
        '429':
          description: Exceeded rate limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    type: string
                  jsonrpc:
                    type: string
        '500':
          description: The server encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    type: string
                  jsonrpc:
                    type: string
