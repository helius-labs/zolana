  /getShieldedTransactionsByNullifiers:
    summary: getShieldedTransactionsByNullifiers
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                id:
                  type: string
                  description: An ID to identify the request.
                  enum:
                  - test-account
                jsonrpc:
                  type: string
                  description: The version of the JSON-RPC protocol.
                  enum:
                  - '2.0'
                method:
                  type: string
                  description: The name of the method to invoke.
                  enum:
                  - getShieldedTransactionsByNullifiers
                params:
                  type: object
                  required:
                  - nullifiers
                  properties:
                    cursor:
                      oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/Base64String'
                    limit:
                      oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/Limit'
                    nullifiers:
                      type: array
                      items:
                        $ref: '#/components/schemas/Hash'
                  additionalProperties: false
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - jsonrpc
                - id
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    type: string
                    description: An ID to identify the response.
                    enum:
                    - test-account
                  jsonrpc:
                    type: string
                    description: The version of the JSON-RPC protocol.
                    enum:
                    - '2.0'
                  result:
                    type: object
                    required:
                    - context
                    - transactions
                    properties:
                      context:
                        $ref: '#/components/schemas/Context'
                      nextCursor:
                        oneOf:
                        - type: 'null'
                        - $ref: '#/components/schemas/Base64String'
                      scannedThrough:
                        oneOf:
                        - type: 'null'
                        - $ref: '#/components/schemas/Base64String'
                          description: |-
                            Where the scan reached, when it ran out of rows rather than filling a
                            page.

                            `next_cursor` is the last returned row's position, and a query for
                            unspent nullifiers returns none. Present only on a page the limit did not
                            truncate, which is when "no match exists at or before this position"
                            holds.
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShieldedTransaction'
                        description: |-
                          Transaction-level matches; each returned transaction spends at least one
                          requested nullifier and includes all of its output and input slots.
                    additionalProperties: false
        '429':
          description: Exceeded rate limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    type: string
                  jsonrpc:
                    type: string
        '500':
          description: The server encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
