[package]
name = "spr-interface"
version = "0.1.0"
description = "Shared instructions, account layouts, and verification interfaces for the SPR shielded pool."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]

[features]
default = ["verifying-keys", "tree"]
borsh = ["dep:borsh", "solana-address/borsh"]
events = []
verifying-keys = ["dep:groth16-solana"]
tree = ["dep:spr-tree"]

[dependencies]
arrayvec = { workspace = true }
borsh = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["min_const_generics"] }
solana-address = { workspace = true, features = ["bytemuck"] }
solana-pubkey = { workspace = true }
groth16-solana = { workspace = true, optional = true }
spr-hasher = { workspace = true }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
spr-event = { workspace = true }
spr-tree = { workspace = true, optional = true }

[dev-dependencies]
bytemuck = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solana-address = { workspace = true }
solana-message = { workspace = true }
solana-rent = { workspace = true }
spr-hasher = { path = "../hasher", default-features = false }
spr-tree = { path = "../tree" }
