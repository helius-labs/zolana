[package]
name = "zolana-interface"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[test]]
name = "output_data"
path = "tests/output_data.rs"
required-features = ["output-codec"]

[features]
default = ["verifying-keys", "tree"]
borsh = ["dep:borsh", "solana-address/borsh"]
output-codec = ["borsh"]
solana = ["dep:solana-instruction", "borsh", "tree"]
verifying-keys = ["dep:groth16-solana"]
tree = ["dep:zolana-tree"]

[dependencies]
arrayvec = { workspace = true }
borsh = { workspace = true, optional = true }
bytemuck = { workspace = true }
solana-address = { workspace = true, features = ["bytemuck"] }
solana-instruction = { workspace = true, optional = true }
solana-pubkey = { workspace = true }
groth16-solana = { workspace = true, optional = true }
zolana-hasher = { workspace = true }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
zolana-tree = { workspace = true, optional = true }

[dev-dependencies]
bytemuck = { workspace = true }
proptest = { workspace = true }
solana-address = { workspace = true }
# Transaction-size tests build real v1 messages; dev-only, never on-chain.
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-rent = { workspace = true }
zolana-hasher = { workspace = true }
zolana-tree = { workspace = true }
