[package]
name = "spr-tree"
version = "0.1.0"
description = "Merkle tree accounts and nullifier trees for the SPR protocol."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]

[features]
default = []
# Loading a tree from a pinocchio `AccountView`. Off for clients that only
# deserialize the account out of bytes; that path needs no Solana runtime.
account-view = ["dep:pinocchio"]
# Groth16 verification of batch nullifier-tree updates, and the verifying keys.
# Off for clients that build or relay a batch update without checking it.
verify = ["dep:groth16-solana"]
# Relaxes the height == 40 check in `nullifier_tree::init` so tests can build
# small trees. Never enable it for a build that produces the on-chain program.
test-only = []
log = ["dep:solana-msg"]
profile-program = ["dep:light-program-profiler", "light-program-profiler/profile-program"]

[dependencies]
spr-event = { workspace = true }
spr-hasher = { workspace = true }
groth16-solana = { workspace = true, optional = true }
pinocchio = { workspace = true, optional = true }
solana-msg = { workspace = true, features = ["alloc"], optional = true }
borsh = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
zerocopy = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
wincode = { workspace = true }
light-program-profiler = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
serde_json = { workspace = true }
spr-merkle-tree = { workspace = true }
spr-client = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']
