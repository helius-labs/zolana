[package]
name = "zolana-event"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Decode and indexer-reconstruction helpers (used by indexers and wallet deposit
# discovery, never by the on-chain program). Off by default so the program build
# stays lean.
program-test = ["dep:solana-pubkey", "zolana-interface/output-codec"]
nullifier-tree = ["dep:zolana-tree"]

[[test]]
name = "indexed_events"
path = "tests/indexed_events.rs"
required-features = ["program-test"]

[[test]]
name = "reconstruction"
path = "tests/reconstruction.rs"
required-features = ["program-test"]

[dependencies]
borsh = { workspace = true }
solana-pubkey = { workspace = true, optional = true }
# Instruction data, tags and the output-payload encoding the reconstruction
# parses. Default features off so an indexer that only decodes events does not
# build the verifying keys or the tree account layout.
zolana-interface = { path = "../interface", version = "0.1.0", default-features = false, features = ["borsh"] }
zolana-tree = { workspace = true, optional = true }
