[package]
name = "zolana-account-checks"
version = "0.8.0"
description = "Checks for solana accounts."
readme = "README.md"
repository.workspace = true
license.workspace = true
edition = "2021"

[features]
default = ["std", "msg"]
std = []
msg = ["dep:solana-msg"]
test-only = ["dep:rand", "std"]
upgrade-authority = ["dep:bincode", "dep:solana-loader-v3-interface", "dep:solana-sdk-ids"]

[dependencies]
bincode = { workspace = true, optional = true }
solana-account-view = { workspace = true }
solana-address = { workspace = true }
solana-program-error = { workspace = true }
solana-loader-v3-interface = { workspace = true, optional = true, features = ["serde"] }
solana-msg = { workspace = true, optional = true, features = ["alloc"] }
solana-sdk-ids = { workspace = true, optional = true }
thiserror = { workspace = true }
rand = { workspace = true, optional = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
