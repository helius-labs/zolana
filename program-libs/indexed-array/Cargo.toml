[package]
name = "spr-indexed-array"
version = "0.1.0"
description = "Implementation of indexed (and concurrent) Merkle tree in Rust"
readme = "README.md"
repository.workspace = true
license.workspace = true
edition = "2021"

publish = ["crates-io"]

[dependencies]
spr-hasher = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
spr-hasher = { path = "../hasher", default-features = false }
rand = { workspace = true }
num-bigint = { workspace = true, features = ["rand"] }
