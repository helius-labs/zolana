[package]
name = "dynamic-swap-test"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[dependencies]
anyhow = { workspace = true }
bytemuck = { workspace = true }
dynamic-swap-program = { path = "../program" }
dynamic-swap-prover = { path = "../prover" }
dynamic-swap-sdk = { path = "../sdk" }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-rpc-client = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-program-test = { workspace = true, features = ["localnet"] }
spr-test-utils = { workspace = true, features = ["bench"] }
spr-transaction = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }

[dev-dependencies]
spr-program = { workspace = true, features = ["shielded-pda"] }
mollusk-svm = { workspace = true }
light-program-profiler = { workspace = true, features = ["mollusk"] }
solana-account = { workspace = true }

[[test]]
name = "bench_cu"
path = "tests/bench_cu.rs"

[[test]]
name = "pair"
path = "tests/pair.rs"

[[test]]
name = "negative"
path = "tests/negative.rs"

[[test]]
name = "escrow_flow"
path = "tests/escrow_flow.rs"

[[test]]
name = "escrow_refund"
path = "tests/escrow_refund.rs"
