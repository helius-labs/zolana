[package]
name = "dynamic-swap-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "dynamic_swap_program"
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
profile-program = ["light-program-profiler/profile-program"]

[dependencies]
borsh = { workspace = true }
groth16-solana = { workspace = true, features = ["bsb22"] }
light-program-profiler = { workspace = true }
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-system = { workspace = true }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
zolana-account-checks = { workspace = true }
zolana-hasher = { workspace = true, features = ["poseidon"] }
zolana-interface = { workspace = true, features = ["solana"] }
# `min_const_generics`: without it bytemuck only implements Pod/Zeroable for
# arrays up to 32 elements, and `Pair` holds the 33-byte SEC1-compressed maker
# encryption key. The feature is purely additive.
bytemuck = { workspace = true, features = ["min_const_generics"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
