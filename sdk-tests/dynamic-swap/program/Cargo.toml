[package]
name = "dynamic-swap-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "dynamic_swap_program"
crate-type = ["cdylib", "lib"]

[features]
# The committed verifying keys come from an example setup nobody vouches for,
# so they are generated as SetupKind::InsecureTest and do not compile without
# this feature. On by default: this program is a test/example, never a
# devnet or mainnet deployment.
default = ["insecure-test-setup"]
insecure-test-setup = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
profile-program = ["light-program-profiler/profile-program"]
circuits = [
    "dep:spr-transaction",
    "spr-program/client",
    "spr-program/setup",
    "spr-program/parallel",
]
r1cs-export = ["spr-program/r1cs-export"]

[dependencies]
borsh = { workspace = true }
light-program-profiler = { workspace = true }
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-system = { workspace = true }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
spr-account-checks = { workspace = true }
spr-hasher = { workspace = true }
spr-interface = { workspace = true }
spr-program = { workspace = true, features = ["cpi", "verifier"] }
spr-transaction = { workspace = true, optional = true }
# `min_const_generics`: without it bytemuck only implements Pod/Zeroable for
# arrays up to 32 elements, and `Pair` holds the 33-byte tagged X25519 maker
# encryption key. The feature is purely additive.
bytemuck = { workspace = true, features = ["min_const_generics"] }

[dev-dependencies]
spr-account-checks = { workspace = true, features = ["test-only"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
