[package]
name = "kamino-vault-rfq-example"
version = "0.1.0"
edition.workspace = true
publish = false
autoexamples = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
kamino-vault-market-maker = { path = "../market-maker" }
kamino-vault-rfq-sdk = { path = "../sdk" }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
zolana-client = { workspace = true, features = ["indexer-api", "solana-rpc"] }
zolana-interface = { workspace = true }
zolana-keypair = { workspace = true }
zolana-program = { workspace = true }
zolana-program-test = { workspace = true, features = ["localnet"] }
zolana-test-utils = { workspace = true }
zolana-transaction = { workspace = true }

[[example]]
name = "deposit_and_withdraw"
path = "examples/deposit_and_withdraw.rs"
