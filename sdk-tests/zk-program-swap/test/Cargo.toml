[package]
name = "swap-test-validator"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[dependencies]
anyhow = { workspace = true }
swap-program = { path = "../program" }
swap-prover = { path = "../prover" }
swap-sdk = { path = "../sdk" }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-program-test = { workspace = true, features = ["localnet"] }
spr-test-utils = { workspace = true, features = ["bench"] }
spr-transaction = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }

[dev-dependencies]
mollusk-svm = { workspace = true }
light-program-profiler = { workspace = true, features = ["mollusk"] }

[[test]]
name = "bench_cu"
path = "tests/bench_cu.rs"

[[test]]
name = "swap"
path = "tests/swap.rs"

[[test]]
name = "cancel"
path = "tests/cancel.rs"

[[test]]
name = "take_verifiable_encryption"
path = "tests/take_verifiable_encryption.rs"
