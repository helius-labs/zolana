[package]
name = "client-example"
version = "0.1.0"
edition.workspace = true
publish = false
autoexamples = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
bytemuck = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-interface = { workspace = true }
spr-program = { workspace = true, features = ["protocol-instructions"] }
spr-keypair = { workspace = true }
spr-program-test = { workspace = true, features = ["localnet"] }
spr-test-utils = { workspace = true }
spr-transaction = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }

[[example]]
name = "deposit_transfer_withdraw"
path = "deposit_transfer_withdraw.rs"

[[example]]
name = "merge_transfer"
path = "merge_transfer.rs"

[[example]]
name = "optimized_merge_transfer"
path = "optimized_merge_transfer.rs"
