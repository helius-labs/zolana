[package]
name = "compression-example-prover"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "compression_example_prover"
path = "src/lib.rs"

[[bin]]
name = "compression-example-prover-setup"
path = "src/bin/setup.rs"

[dependencies]
zolana-client = { workspace = true }
zolana-gnark-ffi-prover = { workspace = true }
zolana-program = { workspace = true, features = ["compression"] }

[build-dependencies]
zolana-gnark-ffi-prover-build = { workspace = true }
