[package]
name = "compression-example-prover"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "compression_example_prover"
path = "src/lib.rs"

[[bin]]
name = "compression-example-prover-setup"
path = "src/bin/setup.rs"

[dependencies]
compression-example-program = { path = "../program" }
groth16-solana = { workspace = true, features = ["bsb22", "gnark-vk"] }
num-bigint = { workspace = true }
serde_json = { workspace = true }
solana-bn254 = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
bindgen = { workspace = true }
