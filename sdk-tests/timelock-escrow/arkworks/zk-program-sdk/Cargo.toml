[package]
name = "zk-program-sdk"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
ark-bn254 = { workspace = true }
ark-ec = { version = "0.5", optional = true }
ark-ff = { workspace = true }
ark-groth16 = { version = "0.5", default-features = false, features = ["std", "parallel"], optional = true }
ark-r1cs-std = { version = "0.5", default-features = false, features = ["std"] }
ark-relations = { version = "0.5", default-features = false, features = ["std"] }
ark-serialize = { workspace = true, optional = true }
ark-std = { workspace = true, features = ["getrandom"] }
borsh = { workspace = true }
groth16-solana = { workspace = true, optional = true }
light-poseidon = { workspace = true }
solana-address = { workspace = true }
solana-bn254 = { workspace = true, optional = true }
thiserror = { workspace = true }
zk-program-sdk-macros = { path = "../zk-program-sdk-macros" }
zolana-client = { workspace = true }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true }
zolana-keypair = { workspace = true }
zolana-program = { workspace = true }
zolana-transaction = { workspace = true }

[features]
default = ["client", "setup", "encrypt"]
client = [
    "dep:ark-ec",
    "dep:ark-groth16",
    "dep:ark-serialize",
    "dep:groth16-solana",
    "dep:solana-bn254",
]
setup = [
    "dep:ark-ec",
    "dep:ark-groth16",
    "dep:ark-serialize",
    "dep:groth16-solana",
    "groth16-solana?/gnark-vk",
]
encrypt = ["client"]

[[test]]
name = "circuit"
required-features = ["client", "setup", "encrypt"]

[dev-dependencies]
groth16-solana = { workspace = true, features = ["gnark-vk"] }
solana-signature = { workspace = true }
