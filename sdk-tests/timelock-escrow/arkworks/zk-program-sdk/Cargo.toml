[package]
name = "zk-program-sdk"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
ark-bn254 = { workspace = true }
ark-ec = { version = "0.5", optional = true }
ark-ff = { workspace = true }
ark-groth16 = { version = "0.5", default-features = false, features = ["std"], optional = true }
ark-poly = { version = "0.5", default-features = false, features = ["std"], optional = true }
ark-r1cs-std = { version = "0.5", default-features = false, features = ["std"] }
ark-relations = { version = "0.5", default-features = false, features = ["std"] }
ark-serialize = { workspace = true, optional = true }
ark-std = { workspace = true, features = ["getrandom"] }
borsh = { workspace = true }
groth16-solana = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
light-poseidon = { workspace = true }
rayon = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["curve25519"] }
solana-bn254 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
solana-signature = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
zk-program-sdk-macros = { path = "../zk-program-sdk-macros" }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true }
zolana-keypair = { workspace = true }
zolana-program = { workspace = true }
zolana-transaction = { workspace = true }

[features]
default = ["client", "setup", "encrypt", "parallel"]
client = [
    "dep:ark-ec",
    "dep:ark-groth16",
    "dep:ark-poly",
    "dep:ark-serialize",
    "dep:groth16-solana",
    "dep:solana-bn254",
]
setup = [
    "dep:ark-ec",
    "dep:ark-groth16",
    "dep:ark-serialize",
    "dep:groth16-solana",
    "groth16-solana?/gnark-vk",
]
encrypt = ["client"]
parallel = ["client", "dep:rayon", "ark-groth16/parallel", "ark-poly/parallel"]
serde = ["dep:serde", "zolana-keypair/serde", "zolana-transaction/serde"]
tsify = [
    "serde",
    "dep:tsify",
    "dep:wasm-bindgen",
    "zolana-keypair/tsify",
    "zolana-transaction/tsify",
]
wasm = ["client", "tsify", "dep:js-sys", "dep:serde-wasm-bindgen"]
wasm-prover = ["wasm"]
wasm-verify = ["wasm", "groth16-solana/gnark-vk"]

[[test]]
name = "circuit"
required-features = ["client", "setup", "encrypt"]

[dev-dependencies]
groth16-solana = { workspace = true, features = ["gnark-vk"] }
serde_json = { workspace = true }
