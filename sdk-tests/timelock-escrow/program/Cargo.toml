[package]
name = "timelock-escrow-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "timelock_escrow_program"
crate-type = ["cdylib", "lib"]

[target.'cfg(all(not(xark), not(xark_client)))'.dependencies]
spr-keypair = { workspace = true, optional = true }
spr-transaction = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
# The committed verifying keys come from an example setup nobody vouches for,
# so they are generated as SetupKind::InsecureTest and do not compile without
# this feature. On by default: this program is a test/example, never a
# devnet or mainnet deployment.
default = ["insecure-test-setup"]
insecure-test-setup = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
profile-program = ["light-program-profiler/profile-program"]
circuits = [
    "dep:borsh",
    "dep:xark",
    "dep:solana-instruction",
    "dep:spr-keypair",
    "dep:spr-transaction",
    "spr-program/client",
    "spr-program/setup",
    "spr-program/parallel",
]
wasm = [
    "dep:borsh",
    "dep:xark",
    "dep:spr-keypair",
    "dep:spr-transaction",
    "dep:solana-instruction",
    "dep:serde",
    "dep:tsify",
    "dep:wasm-bindgen",
    "spr-program/wasm",
]
localnet = ["circuits"]
r1cs-export = ["spr-program/r1cs-export"]

[dependencies]
xark = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }
light-program-profiler = { workspace = true }
pinocchio = { workspace = true, features = ["cpi", "sha2"] }
solana-instruction = { workspace = true, optional = true }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
spr-account-checks = { workspace = true }
spr-hasher = { workspace = true }
spr-interface = { workspace = true }
spr-program = { workspace = true, features = ["cpi", "compression", "verifier"] }

[dev-dependencies]
serde_json = { workspace = true }
anyhow = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-program-test = { workspace = true, features = ["localnet"] }

[[test]]
name = "zk_functional"
required-features = ["circuits"]

[[test]]
name = "escrow"
required-features = ["localnet"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd", "--enable-threads", "--enable-bulk-memory", "--enable-mutable-globals"]

[lints.clippy]
disallowed_types = "allow"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
