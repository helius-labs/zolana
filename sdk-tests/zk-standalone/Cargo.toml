[package]
name = "spr-zk-standalone-fixture"
version = "0.1.0"
description = "A standalone Xark circuit and a Solana verifier for its public payout."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["insecure-test-setup", "circuits"]
insecure-test-setup = []
circuits = ["dep:xark", "dep:spr-circuit"]
build-circuits = ["circuits"]
wasm = ["circuits"]
bpf-entrypoint = []

[dependencies]
pinocchio = { workspace = true }
spr-program = { workspace = true, features = ["verifier"] }

# The client feature is host-only, so it is enabled here rather than by the
# default `circuits` feature, which would also enable it for the SBF build.
[target.'cfg(not(target_os = "solana"))'.dependencies]
spr-program = { workspace = true, features = ["verifier", "client"] }
xark = { workspace = true, optional = true }
spr-circuit = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "standalone"
required-features = ["circuits"]

[[test]]
name = "parity"
required-features = ["circuits"]

[lints.clippy]
disallowed_types = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)', 'cfg(xark_client)', 'cfg(target_os, values("solana"))'] }
