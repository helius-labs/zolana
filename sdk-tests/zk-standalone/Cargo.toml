[package]
name = "zolana-zk-standalone-fixture"
version = "0.1.0"
description = "A standalone Xark circuit and a Solana verifier for its public payout."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["insecure-test-setup", "circuits"]
insecure-test-setup = []
circuits = ["dep:xark", "dep:zolana-circuit", "zolana-program/client"]
r1cs-export = ["circuits"]
wasm = ["circuits"]
bpf-entrypoint = []

[dependencies]
pinocchio = { workspace = true }
zolana-program = { workspace = true, features = ["verifier"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
xark = { workspace = true, optional = true }
zolana-circuit = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "standalone"
required-features = ["circuits"]

[[test]]
name = "parity"
required-features = ["circuits"]

[lints.clippy]
disallowed_types = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)', 'cfg(xark_client)', 'cfg(target_os, values("solana"))'] }
