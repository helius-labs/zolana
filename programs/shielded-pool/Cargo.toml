[package]
name = "shielded-pool-program"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
profile-program = ["light-program-profiler/profile-program"]
# Registry-backed verification through the bn254-prepared agave fork's
# syscalls. A build with this feature does not load on a stock validator.
vk-registry = [
    "groth16-solana/vk-registry",
    "pinocchio/account-resize",
    "zolana-batched-merkle-tree/vk-registry",
]

[dependencies]
arrayvec = { workspace = true }
ark-bn254 = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
bincode = { workspace = true }
borsh = { workspace = true }
bytemuck = { workspace = true }
groth16-solana = { workspace = true }
light-array-map = { workspace = true }
solana-loader-v3-interface = { workspace = true, features = ["serde"] }
zolana-account-checks = { workspace = true }
zolana-hasher = { workspace = true }
light-program-profiler = { workspace = true }
pinocchio-system = { workspace = true }
pinocchio = { workspace = true }
spl-token-2022-interface = { workspace = true }
tinyvec = { workspace = true }
zolana-batched-merkle-tree = { workspace = true }
zolana-interface = { workspace = true, features = ["borsh"] }
zolana-tree = { workspace = true }
zolana-user-registry-interface = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
zolana-account-checks = { workspace = true, features = ["test-only"] }


[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
