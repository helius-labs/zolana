[package]
name = "user-registry-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "user_registry_tests"
path = "src/lib.rs"

[dependencies]
borsh = { workspace = true }
litesvm = { workspace = true }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }
# The one implementation of "what budget a v1 header must state", so the rig
# cannot drift from what the SDK sends.
spr-client = { workspace = true }
spr-keypair = { workspace = true }

[dev-dependencies]
solana-transaction-error = { workspace = true }
spr-program = { workspace = true }
spr-user-registry = { workspace = true }
