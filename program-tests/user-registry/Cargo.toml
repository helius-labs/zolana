[package]
name = "user-registry-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "user_registry_tests"
path = "src/lib.rs"

[dependencies]
borsh = { workspace = true }
litesvm = { workspace = true, features = ["precompiles"] }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
zolana-user-registry-interface = { workspace = true, features = ["solana"] }
# The one implementation of "what budget a v1 header must state", so the rig
# cannot drift from what the SDK sends.
zolana-client = { workspace = true }
zolana-keypair = { workspace = true }

[dev-dependencies]
solana-transaction-error = { workspace = true }
zolana-user-registry = { workspace = true }
