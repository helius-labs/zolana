[package]
name = "shielded-pool-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
localnet = ["zolana-client/indexer-api", "zolana-client/solana-rpc"]
# Gates the Groth16-backed test binaries that spawn the local prover, so a
# plain `cargo test -p shielded-pool-tests` stays hermetic by construction.
proofs = []

[dependencies]
anyhow = { workspace = true }
solana-instruction = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-clock = { workspace = true }
serial_test = { workspace = true }
solana-address = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
spl-token-2022-interface = { workspace = true }
solana-system-interface = { workspace = true }
spl-token = { workspace = true }
zolana-account-checks = { workspace = true, features = ["test-only"] }
pinocchio = { workspace = true }
shielded-pool-program = { workspace = true, features = ["test-sbf"] }
zolana-interface = { workspace = true }
zolana-event = { workspace = true, features = ["program-test"] }
zolana-keypair = { workspace = true }
zolana-client = { workspace = true }
zolana-program-test = { workspace = true }
zolana-transaction = { workspace = true }
# Support-library dependencies. The `src/support` layer is compiled as a normal
# library (test binaries link against it), so everything it uses must be a
# normal dependency rather than a dev-dependency. The `forester` support module
# additionally requires the `localnet` feature for zolana-client's indexer/RPC
# surfaces.
solana-account = { workspace = true }
num-bigint = { workspace = true }
zolana-hasher = { workspace = true }
zolana-merkle-tree = { workspace = true }
zolana-smart-account-client = { workspace = true }
zolana-test-utils = { workspace = true, features = ["mollusk"] }
zolana-tree = { workspace = true }
mollusk-svm = { workspace = true }

[dev-dependencies]
wincode = { workspace = true }
borsh = { workspace = true }
bytemuck = { workspace = true }
zolana-user-registry-interface = { workspace = true }
groth16-solana = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
zolana-wallet = { workspace = true }
mollusk-svm = { workspace = true }
light-program-profiler = { workspace = true, features = ["mollusk"] }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }
solana-program-error = { workspace = true }
proptest = { workspace = true }

# Test targets are auto-discovered: every `tests/*.rs` is one binary named after
# the file. No `[[test]]` block per suite to keep in sync, so a suite added here
# cannot fail to become a target -- which is what the hygiene script used to
# police by diffing declarations against the tree.
#
# Names are `<domain>_<intent>`, formerly the directory layout, so the justfile
# and CI selectors are unchanged. Shared setup lives in the `src/support`
# library, imported as `shielded_pool_tests::support::*`.
#
# Only the gated suites are declared, because `required-features` needs a block.
# Declaring one overrides the inferred target rather than adding a second, so
# these stay single targets. A gate that goes missing does not hide its suite:
# the file is still auto-discovered, so it runs in the fast tier and fails
# loudly instead of vanishing.
#
# `cargo check --workspace --all-targets` skips a gated target, so `just
# check-all` and `just clippy` name both features explicitly. Without that these
# ten compile on no PR -- which is how the CU bench broke at #172 unnoticed.

[[test]]
name = "merge_functional"
path = "tests/merge_functional.rs"
required-features = ["proofs"]

[[test]]
name = "transact_functional"
path = "tests/transact_functional.rs"
required-features = ["proofs"]

[[test]]
name = "transact_withdrawal"
path = "tests/transact_withdrawal.rs"
required-features = ["proofs"]

[[test]]
name = "mixed_interface_transfers"
path = "tests/mixed_interface_transfers.rs"
required-features = ["proofs"]

[[test]]
name = "transact_settlement"
path = "tests/transact_settlement.rs"
required-features = ["proofs"]

[[test]]
name = "localnet_e2e"
path = "tests/localnet_e2e.rs"
required-features = ["localnet"]

[[test]]
name = "localnet_deposit"
path = "tests/localnet_deposit.rs"
required-features = ["localnet"]

[[test]]
name = "localnet_photon"
path = "tests/localnet_photon.rs"
required-features = ["localnet"]

[[test]]
name = "localnet_wallet_cli"
path = "tests/localnet_wallet_cli.rs"
required-features = ["localnet"]

[[test]]
name = "bench_cu"
path = "tests/bench_cu.rs"
required-features = ["proofs"]
