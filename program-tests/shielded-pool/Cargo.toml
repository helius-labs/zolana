[package]
name = "shielded-pool-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[features]
default = []
localnet = ["zolana-client/indexer-api", "zolana-client/solana-rpc"]
# Gates the Groth16-backed test binaries that spawn the local prover, so a
# plain `cargo test -p shielded-pool-tests` stays hermetic by construction.
proofs = []

[dependencies]
anyhow = { workspace = true }
solana-instruction = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-clock = { workspace = true }
serial_test = { workspace = true }
solana-address = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
spl-token-2022-interface = { workspace = true }
solana-transaction-error = { workspace = true }
solana-system-interface = { workspace = true }
spl-token = { workspace = true }
zolana-account-checks = { workspace = true }
zolana-interface = { workspace = true }
zolana-event = { workspace = true, features = ["program-test"] }
zolana-keypair = { workspace = true }
zolana-client = { workspace = true }
zolana-program-test = { workspace = true }
zolana-transaction = { workspace = true }
# Support-library dependencies. The `src/support` layer is compiled as a normal
# library (test binaries link against it), so everything it uses must be a
# normal dependency rather than a dev-dependency. The `forester` support module
# additionally requires the `localnet` feature for zolana-client's indexer/RPC
# surfaces.
solana-account = { workspace = true }
num-bigint = { workspace = true }
zolana-hasher = { workspace = true }
zolana-merkle-tree = { workspace = true }
zolana-smart-account-client = { workspace = true }
zolana-test-utils = { workspace = true, features = ["mollusk"] }
zolana-tree = { workspace = true }
mollusk-svm = { workspace = true }

[dev-dependencies]
borsh = { workspace = true }
bytemuck = { workspace = true }
zolana-user-registry-interface = { workspace = true }
groth16-solana = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
zolana-wallet = { workspace = true }
mollusk-svm = { workspace = true }
light-program-profiler = { workspace = true, features = ["mollusk"] }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }
solana-program-error = { workspace = true }
proptest = { workspace = true }

# Test targets are declared explicitly (`autotests = false`): each `[[test]]`
# maps one binary directly to its leaf file under `tests/<domain>/<intent>.rs`,
# mirroring the domain-first layout. Shared setup lives in the `src/support`
# library, imported as `shielded_pool_tests::support::*` -- there are no thin
# `#[path]` wrapper entrypoints. Groupings below match the test tiers the
# justfile and CI select.

# --- Fast functional / rejection (hermetic LiteSVM + Mollusk) ---

[[test]]
name = "admin_functional"
path = "tests/admin/functional.rs"

[[test]]
name = "admin_rejection"
path = "tests/admin/rejection.rs"

[[test]]
name = "admin_edge_cases"
path = "tests/admin/edge_cases.rs"

[[test]]
name = "protocol_config_contract"
path = "tests/protocol_config/contract.rs"

[[test]]
name = "tree_contract"
path = "tests/tree/contract.rs"

[[test]]
name = "spl_interface_contract"
path = "tests/spl_interface/contract.rs"

[[test]]
name = "spl_interface_functional"
path = "tests/spl_interface/functional.rs"

[[test]]
name = "spl_interface_rejection"
path = "tests/spl_interface/rejection.rs"

[[test]]
name = "zone_config_contract"
path = "tests/zone_config/contract.rs"

[[test]]
name = "deposit_functional"
path = "tests/deposit/functional.rs"

[[test]]
name = "deposit_rejection"
path = "tests/deposit/rejection.rs"

[[test]]
name = "deposit_edge_cases"
path = "tests/deposit/edge_cases.rs"

[[test]]
name = "dispatch_functional"
path = "tests/dispatch/functional.rs"

[[test]]
name = "dispatch_rejection"
path = "tests/dispatch/rejection.rs"

[[test]]
name = "transact_guard"
path = "tests/transact/guard.rs"

# --- Models and cross-cutting contracts (pure model / property / oracle) ---

[[test]]
name = "deposit_model"
path = "tests/deposit/model.rs"

[[test]]
name = "cross_cutting_protocol_model"
path = "tests/cross_cutting/protocol_model.rs"

[[test]]
name = "cross_cutting_temporal"
path = "tests/cross_cutting/temporal.rs"

[[test]]
name = "cross_cutting_authorization"
path = "tests/cross_cutting/authorization.rs"

[[test]]
name = "cross_cutting_evolution"
path = "tests/cross_cutting/evolution.rs"

[[test]]
name = "cross_cutting_cu_budget"
path = "tests/cross_cutting/cu_budget.rs"

[[test]]
name = "nullifier_batch"
path = "tests/nullifier/batch.rs"

[[test]]
name = "merge_contract"
path = "tests/merge/contract.rs"

# --- Mollusk mutation coverage ---

[[test]]
name = "deposit_mutation"
path = "tests/deposit/mutation.rs"

# --- Proof-backed integration (spawns the local prover) ---

[[test]]
name = "transact_functional"
path = "tests/transact/functional.rs"
required-features = ["proofs"]

[[test]]
name = "transact_withdrawal"
path = "tests/transact/withdrawal.rs"
required-features = ["proofs"]

[[test]]
name = "interface_transfers"
path = "tests/transact/interface_transfers.rs"

# Proof-backed (spawns the local prover and proves with the real circuits), so
# it sits in the proofs tier with the other Groth16-backed binaries.
[[test]]
name = "mixed_interface_transfers"
path = "tests/transact/mixed_interface_transfers.rs"
required-features = ["proofs"]

[[test]]
name = "transact_settlement"
path = "tests/transact/settlement.rs"
required-features = ["proofs"]

# --- Localnet / Photon (needs a running validator + indexer) ---

[[test]]
name = "localnet_e2e"
path = "tests/localnet/e2e.rs"
required-features = ["localnet"]

[[test]]
name = "localnet_deposit"
path = "tests/localnet/deposit.rs"
required-features = ["localnet"]

[[test]]
name = "localnet_photon"
path = "tests/localnet/photon.rs"
required-features = ["localnet"]

[[test]]
name = "localnet_wallet_cli"
path = "tests/localnet/wallet_cli.rs"
required-features = ["localnet"]

# --- Benchmarks (CU profiling; run with `-- --ignored`) ---

[[test]]
name = "bench_cu"
path = "tests/bench/cu.rs"
required-features = ["proofs"]
