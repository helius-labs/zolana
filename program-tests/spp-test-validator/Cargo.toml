[package]
name = "spp-test-validator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Only the explicit `lifecycle`, `proof_cu` and `transaction_v1` test targets
# build. `lifecycle` and `proof_cu` consume the shared fixture from
# `zolana-test-utils`; `transaction_v1` probes the backend runtime alone.
autotests = false

[dependencies]
anyhow = { workspace = true }
solana-address = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
zolana-client = { workspace = true, features = ["indexer-api", "solana-rpc"] }
zolana-smart-account-client = { workspace = true }
zolana-test-utils = { workspace = true }
zolana-transaction = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true }

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "proof_cu"
path = "tests/proof_cu.rs"

[[test]]
name = "transaction_v1"
path = "tests/transaction_v1.rs"
