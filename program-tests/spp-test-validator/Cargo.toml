[package]
name = "spp-test-validator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Only the explicit `lifecycle` and `proof_cu` test targets build; both consume
# the shared fixture from `zolana-test-utils` (`lifecycle` module).
autotests = false

[dependencies]
anyhow = { workspace = true }
solana-address = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
zolana-client = { workspace = true, features = ["indexer-api", "solana-rpc"] }
zolana-smart-account-client = { workspace = true }
zolana-test-utils = { workspace = true }
zolana-transaction = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
serial_test = { workspace = true }

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "proof_cu"
path = "tests/proof_cu.rs"
