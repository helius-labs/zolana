[package]
name = "spr-test-utils"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
mollusk = ["dep:mollusk-svm", "dep:solana-program-error"]
parallel = ["dep:rayon"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
borsh = { workspace = true }
bytemuck = { workspace = true }
groth16-solana = { workspace = true }
mollusk-svm = { workspace = true, optional = true }
num-bigint = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true, optional = true }
async-trait = { workspace = true }
futures = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-instruction-error = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-program-error = { workspace = true, optional = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true, features = ["serde"] }
solana-transaction-error = { workspace = true }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-interface = { workspace = true }
spr-smart-account-client = { workspace = true }
spr-event = { workspace = true }
spr-event-parser = { workspace = true }
spr-hasher = { workspace = true }
spr-keypair = { workspace = true }
spr-merkle-tree = { workspace = true }
spr-program = { workspace = true, features = ["protocol-instructions"] }
spr-program-test = { workspace = true, features = ["localnet"] }
spr-transaction = { workspace = true }
spr-tree = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }

[dev-dependencies]
proptest = { workspace = true }
# smart_account::settings pins the Anchor discriminator scheme in its unit test.
sha2 = { workspace = true }
solana-rpc-client-api = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
