[package]
name = "custom-ring-cli"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "custom_ring_cli"
path = "src/lib.rs"

[[bin]]
name = "custom-ring"
path = "src/main.rs"

[features]
default = []
# Toggleable smoke feature of the template. One id reaches both sides: the
# program logs a greeting on every instruction, `status` greets locally.
hello = ["custom-ring-program/hello"]

[dependencies]
bincode = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
custom-ring-program = { path = "../program" }
custom-ring-sdk = { path = "../sdk" }
hex = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
solana-address = { workspace = true }
solana-loader-v3-interface = { workspace = true, features = ["serde"] }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction-error = { workspace = true }
toml = { workspace = true }
zolana-client = { workspace = true, features = ["indexer-api", "solana-rpc"] }
zolana-interface = { workspace = true, features = ["solana"] }
zolana-indexer-api = { workspace = true }
zolana-keypair = { workspace = true }
zolana-ring-client = { workspace = true }
zolana-ring-rpc = { workspace = true }
zolana-transaction = { workspace = true }
