# A ring with its own block list. No output may go to an owner on it, every
# other transfer passes. The authority adds owner tags with
# `zolana-ring list add block --owner <tag>`.

name = "own-blocklist"
target = "localnet"
# Replace with the id of keys/program-keypair.json, `zolana-ring new` writes one.
program_id = "71xpmf2e94nEd9T1S32trTQnhY39xfSUeNW7GH4quTw6"
authority_keypair = "~/.config/solana/id.json"

[localnet]
rpc = "http://127.0.0.1:8899"
indexer = "http://127.0.0.1:8784"
prover = "http://127.0.0.1:3001"
ring_rpc = "http://127.0.0.1:8785"

[devnet]
rpc = "https://api.devnet.solana.com"
indexer = "http://zolnet-devnet-1779374825.eu-north-1.elb.amazonaws.com"
prover = "https://d30sgubc9yxiri.cloudfront.net"
ring_rpc = "https://d1ojzfopdqqs5r.cloudfront.net"
ring_rpc_pubkey = "C8TeRCdueRdXj3y4uFDtNywYThc3qeiH2ZGfcbYZzVSs"

[policy]

# each output owner must not be on the block list
[[policy.rules]]
subject = "output-owner"
forbid = "block"
