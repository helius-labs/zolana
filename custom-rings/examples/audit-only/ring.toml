# A ring without a policy table. It proves the audit statement alone and
# every transfer passes. Rules cannot be added later, a policy ring starts
# with a `[policy]` table.

name = "audit-only"
target = "localnet"
# Replace with the id of keys/program-keypair.json, `zolana-ring new` writes one.
