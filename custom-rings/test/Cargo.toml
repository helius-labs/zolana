[package]
name = "custom-ring-test-validator"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[features]
# Must match the image the validator loads, the compiled table is hashed on chain.
allowlist = ["custom-ring-interface/allowlist"]
blocklist = ["custom-ring-interface/blocklist"]
freeze = ["custom-ring-interface/freeze"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bincode = { workspace = true }
custom-ring-interface = { workspace = true }
# The auditor side under test: `audit_ring_transactions` is the call whose
# returned plaintexts the lifecycle asserts against what the sender sent.
custom-ring-program = { path = "../program" }
custom-ring-sdk = { path = "../sdk" }
hex = { workspace = true }
solana-address = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-packet = "3.0"
solana-rent = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
tokio = { workspace = true }
# `serde` is what makes `Transaction`/`VersionedTransaction` serializable for the
# RPC send path; declared here rather than inherited from another crate's features.
zolana-client = { workspace = true, features = ["indexer-api", "solana-rpc"] }
# `solana` pulls in the ring deposit instruction-data types (`RingAssetDeposit`,
# `DepositAsset`) the lifecycle builds its deposits from.
zolana-interface = { workspace = true, features = ["solana"] }
zolana-keypair = { workspace = true }
zolana-program-test = { workspace = true }
zolana-ring-client = { workspace = true, features = ["solana-rpc"] }
zolana-ring-policy = { workspace = true }
zolana-ring-rpc = { path = "../../services/ring-rpc" }
zolana-test-utils = { workspace = true }
zolana-transaction = { workspace = true }
zolana-tree = { workspace = true }
zolana-user-registry-interface = { workspace = true, features = ["solana"] }
zeroize = { workspace = true }

[[test]]
name = "ring"
path = "tests/ring.rs"

[[test]]
name = "shared_sources"
path = "tests/shared_sources.rs"
required-features = ["blocklist"]

[[test]]
name = "policy_rules"
path = "tests/policy_rules.rs"
required-features = ["allowlist", "blocklist", "freeze"]
