[package]
name = "custom-ring-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "custom_ring_program"
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
policy = [
    "dep:solana-address",
    "dep:zolana-batched-merkle-tree",
    "dep:zolana-ring-policy",
    "dep:zolana-tree",
    "custom-ring-interface/policy",
]
allowlist = ["policy", "custom-ring-interface/allowlist"]
blocklist = ["policy", "custom-ring-interface/blocklist"]
freeze = ["policy", "custom-ring-interface/freeze"]

[dependencies]
bincode = { workspace = true }
custom-ring-interface = { workspace = true }
bytemuck = { workspace = true }
# `bsb22`: the auditor circuit's emulated P256 arithmetic adds one BSB22
# commitment, so its proofs verify through `Groth16Verifier::new_with_commitment`.
groth16-solana = { workspace = true, features = ["bsb22"] }
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-system = { workspace = true }
solana-address = { workspace = true, optional = true }
solana-loader-v3-interface = { workspace = true, features = ["serde"] }
solana-curve25519 = { workspace = true }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
zolana-account-checks = { workspace = true }
zolana-interface = { workspace = true, features = ["solana"] }
zolana-batched-merkle-tree = { workspace = true, optional = true }
zolana-ring-policy = { workspace = true, optional = true }
zolana-tree = { workspace = true, optional = true }

[dev-dependencies]
curve25519-dalek = "4.1"
zolana-ring-policy = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
mollusk-svm = { workspace = true }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-program-error = { workspace = true }
solana-pubkey = { workspace = true }
zolana-test-utils = { workspace = true, features = ["mollusk"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]

[[test]]
name = "policy"
required-features = ["policy"]
