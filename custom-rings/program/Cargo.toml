[package]
name = "custom-ring-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "custom_ring_program"
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []

[dependencies]
bincode = { workspace = true }
custom-ring-interface = { workspace = true }
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
# `bsb22`: the custom-ring circuit's lookup arithmetic adds one BSB22
# commitment, so its proofs verify through `Groth16Verifier::new_with_commitment`.
groth16-solana = { workspace = true, features = ["bsb22"] }
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-system = { workspace = true }
solana-loader-v3-interface = { workspace = true, features = ["serde"] }
solana-curve25519 = { workspace = true }
wincode = { workspace = true }
zolana-account-checks = { workspace = true }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true, features = ["borsh"] }
zolana-ring-policy = { workspace = true }
zolana-tree = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
litesvm = { workspace = true }
serde_json = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-bn254 = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
x25519-dalek = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
