[package]
name = "custom-ring-interface"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["verifying-keys"]
verifying-keys = ["dep:groth16-solana"]
# Rule features only add rows to the compiled policy table.
allowlist = []
blocklist = []
freeze = []

[dependencies]
# Required for Pod on the compressed auditor key.
bytemuck = { workspace = true, features = ["min_const_generics"] }
groth16-solana = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["bytemuck"] }
wincode = { workspace = true }
zolana-ring-policy = { workspace = true }
zolana-hasher = { workspace = true, features = ["poseidon", "sha256"] }
zolana-interface = { workspace = true }
