[package]
name = "custom-ring-sdk"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
proofs = ["zolana-client/proofs"]

[dependencies]
zolana-event.workspace = true
borsh = { workspace = true }
num-bigint = { workspace = true }
custom-ring-interface = { workspace = true }
bytemuck = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true, features = ["curve25519"] }
solana-instruction = { workspace = true }
solana-commitment-config = { workspace = true }
solana-instruction-error = { workspace = true }
solana-message = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
solana-transaction = { workspace = true, features = ["serde"] }
solana-transaction-error = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
wincode = { workspace = true }
zeroize = { workspace = true }
zolana-client = { workspace = true }
zolana-interface = { workspace = true }
zolana-program = { workspace = true }
zolana-hasher = { workspace = true }
zolana-indexer-api = { workspace = true }
zolana-keypair = { workspace = true }
zolana-ring-client = { workspace = true }
zolana-ring-policy = { workspace = true }
zolana-transaction = { workspace = true }
zolana-tree = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zolana-api = { workspace = true }
zolana-client = { workspace = true, features = ["solana-rpc"] }
zolana-ring-key-registry = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
curve25519-dalek = "4.1"
sha2 = { workspace = true }
hex = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }

[[test]]
name = "deposit_audit_fixtures"
required-features = ["proofs"]
